<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redirecting...</title>
    <script>
      (function () {
        const segments = window.location.pathname.split("/").filter(Boolean);
        const baseSegment = segments.shift() || "";
        const basePath = baseSegment ? `/${baseSegment}/` : "/";
        const routePath = segments.length ? `/${segments.join("/")}` : "/";
        const target = `${basePath}?p=${encodeURIComponent(
          routePath + window.location.search,
        )}${window.location.hash}`;

        window.location.replace(target);
      })();
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
