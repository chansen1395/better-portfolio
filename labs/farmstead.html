        // --- KUBOTA ---
        function drawKubota(x, y, sx, sy, s) {
            // Garage floor
            ctx.fillStyle = '#4a4a48';
            ctx.fillRect(sx, sy, s, s);

            // Shadow under vehicle
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.fillRect(sx + 2, sy + 22, 28, 6);

            // Tires
            ctx.fillStyle = PAL.kubotaTire;
            ctx.fillRect(sx + 2, sy + 18, 8, 10);
            ctx.fillRect(sx + 22, sy + 18, 8, 10);
            // Tire highlight
            ctx.fillStyle = '#3a3a38';
            ctx.fillRect(sx + 3, sy + 19, 6, 2);
            ctx.fillRect(sx + 23, sy + 19, 6, 2);
            // Hubcap
            ctx.fillStyle = '#888';
            ctx.fillRect(sx + 4, sy + 22, 4, 3);
            ctx.fillRect(sx + 24, sy + 22, 4, 3);

            // Body
            ctx.fillStyle = PAL.kubotaOrangeDark;
            ctx.fillRect(sx + 4, sy + 6, 24, 16);
            ctx.fillStyle = PAL.kubotaOrange;
            ctx.fillRect(sx + 5, sy + 7, 22, 14);
            ctx.fillStyle = PAL.kubotaOrangeLight;
            ctx.fillRect(sx + 5, sy + 7, 22, 3);

            // ROPS / cab frame
            ctx.fillStyle = '#333';
            ctx.fillRect(sx + 6, sy + 2, 2, 14);
            ctx.fillRect(sx + 22, sy + 2, 2, 14);
            ctx.fillRect(sx + 6, sy + 2, 18, 2);
            // Roof
            ctx.fillStyle = '#444';
            ctx.fillRect(sx + 4, sy, 24, 4);

            // Glass/cab
            ctx.fillStyle = PAL.kubotaGlass;
            ctx.globalAlpha = 0.6;
            ctx.fillRect(sx + 8, sy + 4, 14, 6);
            ctx.globalAlpha = 1;

            // Headlights
            ctx.fillStyle = '#ffe870';
            ctx.fillRect(sx + 26, sy + 10, 4, 4);
            ctx.fillRect(sx + 2, sy + 10, 4, 4);
            // Glow
            ctx.fillStyle = 'rgba(255,232,112,0.15)';
            fillCircle(sx + 28, sy + 12, 6);

            // Exhaust pipe
            ctx.fillStyle = '#555';
            ctx.fillRect(sx + 24, sy - 2, 3, 6);
        }

        // --- FIREPIT ---
        function drawFirepit(x, y, sx, sy, s) {
            // Grass base (from sprite cache)
            ctx.drawImage(SC.grass[hashInt(x, y, 777, 8)], sx, sy);

            // Stone ring
            const cx = sx + s / 2, cy = sy + s / 2;
            const stonePositions = 8;
            for (let i = 0; i < stonePositions; i++) {
                const angle = (i / stonePositions) * Math.PI * 2;
                const stx = cx + Math.cos(angle) * 10 - 3;
                const sty = cy + Math.sin(angle) * 10 - 2;
                ctx.fillStyle = i % 2 === 0 ? PAL.stone1 : PAL.stone2;
                ctx.fillRect(stx, sty, 6, 4);
                ctx.fillStyle = PAL.stoneLight;
                ctx.fillRect(stx, sty, 5, 1);
            }

            // Ash center
            ctx.fillStyle = PAL.ash;
            fillCircle(cx, cy, 7);

            // Fire glow (if logs present)
            if (state.logsAtFirepit > 0) {
                // Stacked firewood
                const logCount = Math.min(state.logsAtFirepit, 10);
                for (let i = 0; i < Math.min(logCount, 4); i++) {
                    ctx.fillStyle = PAL.woodMid;
                    ctx.fillRect(cx - 5 + (i % 2) * 2, cy - 3 + Math.floor(i / 2) * 3, 10, 2);
                    ctx.fillStyle = PAL.bark;
                    ctx.fillRect(cx - 5 + (i % 2) * 2, cy - 3 + Math.floor(i / 2) * 3, 10, 1);
                }

                // Fire
                const flicker = Math.sin(globalTime * 8) * 2;
                ctx.fillStyle = PAL.ember1;
                ctx.globalAlpha = 0.8;
                fillCircle(cx + flicker * 0.3, cy - 2, 5);
                ctx.fillStyle = PAL.ember2;
                ctx.globalAlpha = 0.7;
                fillCircle(cx, cy - 4 + flicker * 0.5, 3);
                ctx.fillStyle = PAL.ember3;
                ctx.globalAlpha = 0.6;
                fillCircle(cx + flicker * 0.2, cy - 6, 2);
                ctx.globalAlpha = 1;

                // Glow on ground
                ctx.fillStyle = 'rgba(240,100,30,0.08)';
                fillCircle(cx, cy, 20 + Math.sin(globalTime * 6) * 3);
            }
        }

        // --- STORE ---
        function drawStoreWall(x, y, sx, sy, s) {
            ctx.fillStyle = PAL.storeWood;
            ctx.fillRect(sx, sy, s, s);
            ctx.fillStyle = '#6a5a48';
            for (let i = 0; i < 5; i++) ctx.fillRect(sx, sy + i * 6 + 5, s, 1);

            if (y === 16) {
                ctx.fillStyle = PAL.storeRoof;
                ctx.fillRect(sx - 2, sy, s + 4, s);

        function drawStoreDoor(x, y, sx, sy, s) {
            ctx.fillStyle = PAL.storeWood;
            ctx.fillRect(sx, sy, s, s);

            for (let i = 0; i < 5; i++) ctx.fillRect(sx, sy + i * 6 + 5, s, 1);
            // Door
            ctx.fillStyle = '#4a3a28';
            ctx.fillRect(sx + 6, sy + 2, 20, s - 2);

            ctx.fillRect(sx + 4, sy - 2, 24, 6);

            // Handle
            ctx.fillStyle = PAL.doorHandle;

        // ============================================================
        // TREE DRAWING - Lush multi-layer canopy
        // ============================================================
        function drawTree(tree, screenX, screenY) {
            const s = TILE;

            if (!tree.alive) {
                drawStump(screenX, screenY, s);
                return;
            }

            const type = tree.type || 0;

            // Ground shadow
            ctx.fillStyle = 'rgba(0,0,0,0.15)';
            fillEllipse(screenX + s / 2 + 3, screenY + s - 2, 12, 4);

            // Select cached sprite (variant based on position)
            const variant = hashInt(tree.x, tree.y, 888, 4);
            let sprite;
            if (type === 0) sprite = SC.oakTree[variant];
            else if (type === 1) sprite = SC.pineTree[variant];
            else sprite = SC.mapleTree[variant];

            // Tree sprite is 48×56, centered over the 32×32 tile
            // Offset: x = screenX - (48-32)/2 = screenX - 8, y = screenY - (56-32) = screenY - 24
            const ambientSway = Math.round(Math.sin(globalTime * 1.2 + tree.x * 2 + tree.y) * 0.6);
            let hitShakeX = 0;
            let hitLiftY = 0;
            if (tree.hitTimer > 0) {
                const shakeT = tree.hitTimer / 0.18;
                const pulse = Math.sin((1 - shakeT) * Math.PI * 8);
                hitShakeX = Math.round(pulse * shakeT * 3 * (tree.hitDir || 1));
                hitLiftY = -Math.round(shakeT * 2);
            }
            ctx.drawImage(sprite, screenX - 8 + ambientSway + hitShakeX, screenY - 24 + hitLiftY);
        }

        function drawStump(sx, sy, s) {
            // Stump base
            ctx.fillStyle = PAL.woodDark;
            ctx.fillRect(sx + 10, sy + 18, 12, 12);
            ctx.fillStyle = PAL.woodMid;
            ctx.fillRect(sx + 11, sy + 19, 10, 10);
            // Growth rings on top
            ctx.fillStyle = PAL.woodLight;
            ctx.fillRect(sx + 12, sy + 18, 8, 3);
            ctx.fillStyle = PAL.woodDark;
            ctx.fillRect(sx + 14, sy + 19, 4, 1);
            // Bark texture
            ctx.fillStyle = PAL.bark;
            ctx.fillRect(sx + 10, sy + 22, 1, 6);
            ctx.fillRect(sx + 21, sy + 20, 1, 8);
        }

        // Pixel-art circle: scanline filled, no anti-aliasing, uses current fillStyle
        function fillCircle(cx, cy, r) {
            cx = Math.round(cx); cy = Math.round(cy); r = Math.round(r);
            for (let dy = -r; dy <= r; dy++) {
                const halfW = Math.round(Math.sqrt(r * r - dy * dy));
                if (halfW > 0) ctx.fillRect(cx - halfW, cy + dy, halfW * 2, 1);
            }
        }

        // Pixel-art ellipse: scanline filled, no anti-aliasing
        function fillEllipse(cx, cy, rx, ry) {
            cx = Math.round(cx); cy = Math.round(cy);
            rx = Math.round(rx); ry = Math.round(ry);
            for (let dy = -ry; dy <= ry; dy++) {
                const halfW = Math.round(rx * Math.sqrt(1 - (dy * dy) / (ry * ry)));
                if (halfW > 0) ctx.fillRect(cx - halfW, cy + dy, halfW * 2, 1);
            }
        }

        // Pixel-art triangle: scanline filled, no anti-aliasing
        function drawTriangle(cx, top, baseW, h) {
            cx = Math.round(cx); top = Math.round(top);
            for (let dy = 0; dy < h; dy++) {
                const t = dy / h;
                const halfW = Math.round(baseW * t / 2);
                ctx.fillRect(cx - halfW, top + dy, Math.max(halfW * 2, 1), 1);
            }
        }

        const ACTION_SWING_START = 0.93;
        const ACTION_IMPACT_START = 1.0;

        // ============================================================
        // PLAYER DRAWING - Proper pixel character
        // ============================================================
        function drawPlayer(screenX, screenY) {
            const w = player.w, h = player.h;
            const dir = player.dir; // 0=up, 1=right, 2=down, 3=left
            const walkFrame = player.moving ? Math.floor(player.walkTimer * 8) % 4 : 0;
            const legOff = player.moving ? [0, 2, 0, -2][walkFrame] : 0;
            const bobY = player.moving ? [0, -1, 0, -1][walkFrame] : 0;

            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.18)';
            fillEllipse(screenX + w / 2, screenY + h + 1, w / 2 + 1, 3);

            // Determine chop phase if swinging
            let chopPhase = -1;
            if (state.isChopping || state.isSplitting) {
                const chopMax = state.isChopping ? getChopTime() : getSplitTime();
                const chopRaw = state.isChopping ? state.chopProgress : state.splitProgress;
                const chopT = Math.min(chopRaw / chopMax, 1);
                if (state.isChopping) {
                    // 3-strike cycle: each strike winds up, swings, impacts
                    if (chopT >= 0.97) chopPhase = 2;
                    else {
                        const strikeT = (chopT * 3) % 1;
                        if (strikeT < 0.45) chopPhase = 0;
                        else if (strikeT < 0.75) chopPhase = 1;
                        else chopPhase = 2;
                    }
                } else {
                    // Single stroke for splitting
                    if (chopT < ACTION_SWING_START) chopPhase = 0;
                    else if (chopT < ACTION_IMPACT_START) chopPhase = 1;
                    else chopPhase = 2;
                }
            }

            // Body lean during impact
            const leanX = (chopPhase === 1 || chopPhase === 2) ? [0, 2, 0, -2][dir] : 0;
            const leanY = (chopPhase === 1 || chopPhase === 2) ? [-1, 0, 2, 0][dir] : 0;

            const bx = screenX + leanX, by = screenY + bobY + leanY;

            // ===== BODY LAYOUT (16w x ~30 visual height) =====
            // Hat:   y-4 to y+0   (4px)
            // Head:  y+0 to y+8   (8px)
            // Torso: y+8 to y+18  (10px)
            // Legs:  y+18 to y+24 (6px)
            // Boots: y+24 to y+28 (4px)

            // --- BOOTS ---
            ctx.fillStyle = PAL.boots;
            ctx.fillRect(bx + 2 + legOff, by + 24, 5, 4);
            ctx.fillRect(bx + w - 7 - legOff, by + 24, 5, 4);
            // Boot dark edge
            ctx.fillStyle = '#3a2820';
            ctx.fillRect(bx + 2 + legOff, by + 24, 5, 1);
            ctx.fillRect(bx + w - 7 - legOff, by + 24, 5, 1);
            // Boot sole
            ctx.fillStyle = '#2a1a12';
            ctx.fillRect(bx + 2 + legOff, by + 27, 5, 1);
            ctx.fillRect(bx + w - 7 - legOff, by + 27, 5, 1);

            // --- LEGS / JEANS ---
            ctx.fillStyle = PAL.pantsJeanDark;
            ctx.fillRect(bx + 3 + legOff, by + 18, 4, 7);
            ctx.fillRect(bx + w - 7 - legOff, by + 18, 4, 7);
            ctx.fillStyle = PAL.pantsJean;
            ctx.fillRect(bx + 4 + legOff, by + 18, 2, 6);
            ctx.fillRect(bx + w - 6 - legOff, by + 18, 2, 6);
            // Belt
            ctx.fillStyle = '#5a4a38';
            ctx.fillRect(bx + 3, by + 17, w - 6, 2);

            // --- TORSO / SHIRT ---
            ctx.fillStyle = PAL.shirtBlueDark;
            ctx.fillRect(bx + 2, by + 8, w - 4, 10);
            ctx.fillStyle = PAL.shirtBlue;
            ctx.fillRect(bx + 3, by + 9, w - 6, 8);
            // Shirt highlight (upper chest)
            ctx.fillStyle = '#5888c8';
            ctx.fillRect(bx + 4, by + 9, w - 8, 2);
            // Collar
            ctx.fillStyle = '#4870a8';
            ctx.fillRect(bx + 5, by + 8, w - 10, 1);

            // --- ARMS & TOOL ---
            if (chopPhase >= 0) {
                const isHoriz = (dir === 1 || dir === 3);
                const flip = (dir === 3) ? -1 : 1;

                if (chopPhase === 0 || chopPhase === 3) {
                    // WINDUP / RECOVER: arms raised, tool above head
                    const lift = chopPhase === 0 ? -8 : -3;
                    ctx.fillStyle = PAL.shirtBlueDark;
                    ctx.fillRect(bx + 2, by + 6 + lift, 3, 8);
                    ctx.fillRect(bx + w - 5, by + 6 + lift, 3, 8);
                    ctx.fillStyle = PAL.skinMid;
                    ctx.fillRect(bx + w / 2 - 2, by + 4 + lift, 4, 3);
                    // Tool above head
                    const tcx = bx + w / 2;
                    const tcy = by + lift - 4;
                    if (state.tool === 'axe' || state.isSplitting) {
                        ctx.fillStyle = PAL.woodMid;
                        ctx.fillRect(tcx - 1, tcy, 2, 10);
                        ctx.fillStyle = PAL.woodDark;
                        ctx.fillRect(tcx - 1, tcy, 1, 10);
                        ctx.fillStyle = '#5a5a60';
                        ctx.fillRect(tcx - 3, tcy - 4, 7, 5);
                        ctx.fillStyle = '#7a7a80';
                        ctx.fillRect(tcx - 2, tcy - 3, 5, 3);
                        ctx.fillStyle = '#c0c0c8';
                        ctx.fillRect(tcx + 3, tcy - 4, 1, 5);
                    } else {
                        ctx.fillStyle = PAL.kubotaOrange;
                        ctx.fillRect(tcx - 3, tcy - 1, 6, 4);
                        ctx.fillStyle = '#888';
                        ctx.fillRect(tcx - 2, tcy - 5, 4, 4);
                    }
                } else {
                    // SWING / IMPACT
                    const ext = chopPhase === 1 ? 4 : 8;
                    const dropY = chopPhase === 1 ? 3 : 5;

                    if (isHoriz) {
                        ctx.fillStyle = PAL.shirtBlueDark;
                        if (flip > 0) {
                            ctx.fillRect(bx + w - 3, by + 10 + dropY, ext + 3, 3);
                        } else {
                            ctx.fillRect(bx - ext, by + 10 + dropY, ext + 3, 3);
                        }
                        const trailX = flip > 0 ? bx : bx + w - 3;
                        ctx.fillRect(trailX, by + 10, 3, 6);
                        ctx.fillStyle = PAL.skinMid;
                        const handX = flip > 0 ? bx + w + ext - 2 : bx - ext;
                        ctx.fillRect(handX, by + 9 + dropY, 3, 3);
                        ctx.fillRect(trailX, by + 15, 3, 2);
                        const toolBX = flip > 0 ? handX + 3 : handX - 10;
                        const toolBY = by + 8 + dropY;
                        if (state.tool === 'axe' || state.isSplitting) {
                            ctx.fillStyle = PAL.woodMid;
                            ctx.fillRect(toolBX, toolBY + 1, 8, 2);
                            ctx.fillStyle = PAL.woodDark;
                            ctx.fillRect(toolBX, toolBY + 1, 8, 1);
                            const bdX = flip > 0 ? toolBX + 6 : toolBX - 3;
                            ctx.fillStyle = '#5a5a60';
                            ctx.fillRect(bdX, toolBY - 2, 5, 7);
                            ctx.fillStyle = '#7a7a80';
                            ctx.fillRect(bdX + 1, toolBY - 1, 3, 5);
                            ctx.fillStyle = '#c0c0c8';
                            ctx.fillRect(flip > 0 ? bdX + 4 : bdX, toolBY - 1, 1, 5);
                        } else {
                            ctx.fillStyle = PAL.kubotaOrange;
                            ctx.fillRect(toolBX, toolBY, 6, 3);
                            ctx.fillStyle = '#888';
                            const sawX = flip > 0 ? toolBX + 5 : toolBX - 4;
                            ctx.fillRect(sawX, toolBY + 1, 4, 2);
                        }
                    } else {
                        const dirSign = dir === 2 ? 1 : -1;
                        ctx.fillStyle = PAL.shirtBlueDark;
                        ctx.fillRect(bx + 2, by + 9 + dropY, 3, 6);
                        ctx.fillRect(bx + w - 5, by + 9 + dropY, 3, 6);
                        ctx.fillStyle = PAL.skinMid;
                        ctx.fillRect(bx + w / 2 - 2, by + 14 + dropY + dirSign * 2, 4, 3);
                        const tcx = bx + w / 2;
                        const toolStartY = by + 16 + dropY + dirSign * 2;
                        if (state.tool === 'axe' || state.isSplitting) {
                            const hLen = 8;
                            ctx.fillStyle = PAL.woodMid;
                            ctx.fillRect(tcx - 1, dirSign > 0 ? toolStartY : toolStartY - hLen, 2, hLen);
                            ctx.fillStyle = PAL.woodDark;
                            ctx.fillRect(tcx - 1, dirSign > 0 ? toolStartY : toolStartY - hLen, 1, hLen);
                            const bladeY = dirSign > 0 ? toolStartY + hLen - 1 : toolStartY - hLen - 4;
                            ctx.fillStyle = '#5a5a60';
                            ctx.fillRect(tcx - 3, bladeY, 6, 4);
                            ctx.fillStyle = '#7a7a80';
                            ctx.fillRect(tcx - 2, bladeY + 1, 4, 2);
                        } else {
                            ctx.fillStyle = PAL.kubotaOrange;
                            const csY = dirSign > 0 ? toolStartY + 3 : toolStartY - 7;
                            ctx.fillRect(tcx - 3, csY, 6, 4);
                            ctx.fillStyle = '#888';
                            ctx.fillRect(tcx - 2, csY + dirSign * 3, 4, 2);
                        }
                    }
                }
            } else {
                // ===== NORMAL WALKING ARMS =====
                const armSwing = player.moving ? [-2, 2, 2, -2][walkFrame] : 0;
                ctx.fillStyle = PAL.shirtBlueDark;
                ctx.fillRect(bx, by + 9 + armSwing, 3, 7);
                ctx.fillRect(bx + w - 3, by + 9 - armSwing, 3, 7);
                // Hands
                ctx.fillStyle = PAL.skinMid;
                ctx.fillRect(bx, by + 15 + armSwing, 3, 2);
                ctx.fillRect(bx + w - 3, by + 15 - armSwing, 3, 2);
            }

            // --- HEAD ---
            ctx.fillStyle = PAL.skinShadow;
            ctx.fillRect(bx + 3, by + 1, 10, 7);
            ctx.fillStyle = PAL.skinLight;
            ctx.fillRect(bx + 4, by + 1, 8, 6);
            ctx.fillStyle = PAL.skinMid;
            ctx.fillRect(bx + 4, by + 6, 8, 1); // chin

            // Face details
            if (dir === 2) { // Facing down
                ctx.fillStyle = '#222';
                ctx.fillRect(bx + 5, by + 3, 2, 2);
                ctx.fillRect(bx + 9, by + 3, 2, 2);
                ctx.fillStyle = '#fff';
                ctx.fillRect(bx + 5, by + 3, 1, 1);
                ctx.fillRect(bx + 9, by + 3, 1, 1);
                ctx.fillStyle = PAL.skinShadow;
                ctx.fillRect(bx + 7, by + 6, 2, 1);
            } else if (dir === 0) { // Facing up
                ctx.fillStyle = PAL.hair;
                ctx.fillRect(bx + 4, by + 1, 8, 5);
            } else { // Left or right
                const faceX = dir === 1 ? 1 : 0;
                ctx.fillStyle = '#222';
                ctx.fillRect(bx + 6 + faceX, by + 3, 2, 2);
                ctx.fillStyle = '#fff';
                ctx.fillRect(bx + 6 + faceX, by + 3, 1, 1);
                ctx.fillStyle = PAL.skinShadow;
                ctx.fillRect(bx + 6 + faceX, by + 6, 2, 1);
            }

            // --- HAT ---
            ctx.fillStyle = PAL.hatTop;
            ctx.fillRect(bx + 4, by - 2, 8, 4);
            ctx.fillStyle = PAL.hatBrim;
            ctx.fillRect(bx + 2, by + 1, 12, 2);
            ctx.fillStyle = '#d8b870';
            ctx.fillRect(bx + 5, by - 1, 6, 1);

            // Carrying logs on back
            if (state.logs > 0) {
                const logCount = Math.min(state.logs, 6);
                for (let i = 0; i < logCount; i++) {
                    ctx.fillStyle = PAL.woodMid;
                    ctx.fillRect(bx - 6 + i % 2, by + 8 + i * 3, 6, 3);
                    ctx.fillStyle = PAL.bark;
                    ctx.fillRect(bx - 6 + i % 2, by + 8 + i * 3, 6, 1);
                    ctx.fillStyle = PAL.woodLight;
                    ctx.fillRect(bx - 6, by + 9 + i * 3, 2, 1);
                }
            }

            // Action progress bar
            if (state.isChopping || state.isSplitting) {
                const prog = state.isChopping ? state.chopProgress : state.splitProgress;
                const maxProg = state.isChopping ? getChopTime() : getSplitTime();
                const pct = Math.min(prog / maxProg, 1);
                const barW = w + 8;
                const barX = bx - 4;
                const barY = by - 8;
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                roundRect(barX, barY, barW, 5, 2);
                ctx.fill();
                ctx.fillStyle = state.isChopping ? '#e86838' : '#f0c860';
                if (pct > 0) {
                    roundRect(barX + 1, barY + 1, (barW - 2) * pct, 3, 1);
                    ctx.fill();
                }
                ctx.fillStyle = 'rgba(255,255,255,0.2)';
                ctx.fillRect(barX + 2, barY + 1, (barW - 4) * pct, 1);
            }
        }

        function getChopTime() { return state.tool === 'chainsaw' ? 0.8 : 2.5; }
        function getSplitTime() { return state.hasSplitter ? 0.6 : 2.0; }

        // ============================================================
        // AMBIENT RENDERING
        // ============================================================
        function drawAmbient() {
            for (const a of ambientParticles) {
                const ax = a.x - cam.x, ay = a.y - cam.y;
                if (ax < -20 || ax > 2000 || ay < -20 || ay > 2000) continue;

                if (a.type === 'butterfly') {
                    const wingAngle = Math.sin(globalTime * 10 + a.phase) * 0.5;
                    ctx.fillStyle = a.color;
                    ctx.globalAlpha = 0.7;
                    // Wings
                    ctx.fillRect(ax - 2 + wingAngle * 2, ay - 1, 3, 2);
                    ctx.fillRect(ax + 1 - wingAngle * 2, ay - 1, 3, 2);
                    // Body
                    ctx.fillStyle = '#333';
                    ctx.fillRect(ax, ay, 2, 3);
                    ctx.globalAlpha = 1;
                } else if (a.type === 'leaf') {
                    ctx.fillStyle = a.color;
                    ctx.globalAlpha = 0.5;
                    const rot = Math.sin(a.phase) * 2;
                    ctx.fillRect(ax + rot, ay, 3, 2);
                    ctx.globalAlpha = 1;
                }
            }
        }

        // ============================================================
        // DAY/NIGHT + GOLDEN HOUR
        // ============================================================
        function drawDayNight() {
            const viewW = canvas.width / (window.devicePixelRatio || 1);
            const viewH = canvas.height / (window.devicePixelRatio || 1);
            const hour = DAY_START_HOUR + state.time * (DAY_END_HOUR - DAY_START_HOUR);

            // Dawn (6-7): warm pink fade out
            if (hour < 7.5) {
                const t = 1 - (hour - 6) / 1.5;
                ctx.fillStyle = `rgba(40,20,60,${t * 0.25})`;
                ctx.fillRect(0, 0, viewW, viewH);
                // Pink horizon glow
                ctx.fillStyle = `rgba(200,100,80,${t * 0.08})`;
                ctx.fillRect(0, viewH * 0.6, viewW, viewH * 0.4);
            }

            // Golden hour (17-18): warm orange tint
            if (hour > 17 && hour < 19) {
                const t = hour < 18 ? (hour - 17) : (19 - hour);
                ctx.fillStyle = `rgba(200,120,40,${t * 0.08})`;
                ctx.fillRect(0, 0, viewW, viewH);
            }

            // Dusk (19-22): blue darkening
            if (hour > 19) {
                const t = (hour - 19) / 3;
                ctx.fillStyle = `rgba(10,10,50,${t * 0.4})`;
                ctx.fillRect(0, 0, viewW, viewH);
            }
        }

        // ============================================================
        // INTERACTION PROMPT
        // ============================================================
        function drawInteractionPrompt() {
            if (state.shopOpen || state.summaryOpen || state.dayOver) return;
            const ft = facingTile();
            let prompt = '';
            const facedTree = treeAt(ft.x, ft.y);
            if (facedTree) prompt = `[E] Chop tree (${state.tool})`;
            else if (nearTile(T.DOOR_SHED, 1) && state.logs > 0 && !state.isSplitting) prompt = '[E] Split logs at shed';
            if (nearTile(T.FIREPIT, 1) && state.splitLogs > 0) prompt = '[E] Stack split logs at firepit';
            if (nearTile(T.DOOR_STORE, 1)) prompt = '[SPACE] Open shop';

            if (prompt) {
                const viewW = canvas.width / (window.devicePixelRatio || 1);
                const px = viewW / 2;
                ctx.font = '600 12px system-ui';
                const textW = ctx.measureText(prompt).width;
                // Background pill
                ctx.fillStyle = 'rgba(20,16,12,0.85)';
                roundRect(px - textW / 2 - 14, 66, textW + 28, 26, 6);
                ctx.fill();
                ctx.strokeStyle = 'rgba(240,200,96,0.3)';
                ctx.lineWidth = 1;
                roundRect(px - textW / 2 - 14, 66, textW + 28, 26, 6);
                ctx.stroke();
                // Text
                ctx.fillStyle = '#f0c860';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(prompt, px, 79);
                ctx.textAlign = 'left';
                ctx.textBaseline = 'alphabetic';
            }
        }

        // ============================================================
        // MAIN UPDATE (unchanged gameplay)
        // ============================================================
        let lastTime = 0;

        function update(dt) {
            globalTime += dt;
            updateAmbient(dt);
            for (const tree of trees) {
                if (tree.hitTimer > 0) tree.hitTimer = Math.max(0, tree.hitTimer - dt);
            }

            if (state.dayOver || state.shopOpen || state.summaryOpen) return;

            state.time += dt / DAY_LENGTH;
            if (state.time >= 1.0) { state.time = 1.0; endDay(); return; }

            let dx = 0, dy = 0;
            if (keys['ArrowUp'] || keys['KeyW']) { dy = -1; player.dir = 0; }
            if (keys['ArrowDown'] || keys['KeyS']) { dy = 1; player.dir = 2; }
            if (keys['ArrowLeft'] || keys['KeyA']) { dx = -1; player.dir = 3; }
            if (keys['ArrowRight'] || keys['KeyD']) { dx = 1; player.dir = 1; }

            if (dx !== 0 || dy !== 0) {
                const len = Math.sqrt(dx * dx + dy * dy);
                dx = (dx / len) * PLAYER_SPEED; dy = (dy / len) * PLAYER_SPEED;
                const nx = player.x + dx, ny = player.y + dy;
                if (canWalk(nx, player.y)) player.x = nx;
                if (canWalk(player.x, ny)) player.y = ny;
                player.moving = true;
                player.walkTimer += dt;
                state.isChopping = false; state.isSplitting = false;
                state.chopProgress = 0; state.splitProgress = 0;
                state.chopHit = false; state.splitHit = false; state.lastChopStrike = -1;
            } else {
                player.moving = false;
            }

            if (justPressed['KeyE']) {
                if (state.isChopping) {
                    // Boost chop progress by 10% when mashing E
                    state.chopProgress += getChopTime() * 0.1;
                } else {
                    const ft = facingTile();
                    const facedTree = treeAt(ft.x, ft.y);
                    if (facedTree && state.logs < state.maxCarry) { state.isChopping = true; state.chopProgress = 0; state.chopHit = false; state.lastChopStrike = -1; }
                    if (nearTile(T.DOOR_SHED, 1) && state.logs > 0 && !state.isSplitting) { state.isSplitting = true; state.splitProgress = 0; state.splitHit = false; }
                    if (nearTile(T.FIREPIT, 1) && state.splitLogs > 0) {
                        state.logsAtFirepit += state.splitLogs;
                        spawnParticles(player.x + player.w / 2, player.y, PAL.woodMid, 8);
                        state.splitLogs = 0; updateHUD();
                    }
                }
            }
            if (justPressed['Space'] && nearTile(T.DOOR_STORE, 1)) openShop();

            if (state.isChopping) {
                state.chopProgress += dt;
                const chopTime = getChopTime();
                const chopT = Math.min(state.chopProgress / chopTime, 1);
                // 3-strike system: small wobbles on strikes 0&1, real damage on strike 2
                const currentStrike = chopT >= 0.97 ? 2 : Math.min(Math.floor(chopT * 3), 2);
                const strikeT = currentStrike === 2 && chopT >= 0.97 ? 1 : (chopT * 3) % 1;
                if (currentStrike !== state.lastChopStrike && strikeT >= 0.45) {
                    state.lastChopStrike = currentStrike;
                    const ft = facingTile(), t = treeAt(ft.x, ft.y);
                    if (t && currentStrike < 2) {
                        // Small wobble on interim strikes
                        t.hitTimer = 0.08;
                        t.hitDir = (player.x + player.w / 2) <= (ft.x * TILE + TILE / 2) ? 1 : -1;
                        spawnParticles(ft.x * TILE + 16, ft.y * TILE + 10, PAL.woodLight, 3);
                    }
                }
                // Apply full damage on the 3rd strike
                if (!state.chopHit && state.chopProgress >= chopTime * ACTION_IMPACT_START) {
                    state.chopHit = true;
                    const ft = facingTile(), t = treeAt(ft.x, ft.y);
                    if (t) {
                        t.health--;
                        t.hitTimer = 0.18;
                        t.hitDir = (player.x + player.w / 2) <= (ft.x * TILE + TILE / 2) ? 1 : -1;
                        spawnParticles(ft.x * TILE + 16, ft.y * TILE + 10, PAL.woodLight, 8);
                        if (t.health <= 0) {
                            t.alive = false; state.logs = Math.min(state.logs + 1, state.maxCarry);
                            spawnParticles(ft.x * TILE + 16, ft.y * TILE + 10, PAL.leaf1, 15);
                            spawnParticles(ft.x * TILE + 16, ft.y * TILE + 10, PAL.leaf2, 10);
                        }
                        updateHUD();
                    }
                }
                if (state.chopProgress >= chopTime) {
                    state.isChopping = false; state.chopProgress = 0; state.chopHit = false;
                    state.lastChopStrike = -1;
                }
            }

            if (state.isSplitting) {
                state.splitProgress += dt;
                const splitTime = getSplitTime();
                if (!state.splitHit && state.splitProgress >= splitTime * ACTION_IMPACT_START) {
                    state.splitHit = true;
                    state.logs--; state.splitLogs += 2; state.totalSplitToday += 2;
                    spawnParticles(player.x + player.w / 2, player.y, PAL.woodLight, 10);
                    updateHUD();
                }
                if (state.splitProgress >= splitTime) {
                    state.splitProgress = 0;
                    state.splitHit = false;
                    if (state.logs <= 0) state.isSplitting = false;
                }
            }

            // Camera - smooth follow
            const viewW = canvas.width / (window.devicePixelRatio || 1);
            const viewH = canvas.height / (window.devicePixelRatio || 1);
            const targetX = player.x + player.w / 2 - viewW / 2;
            const targetY = player.y + player.h / 2 - viewH / 2;
            cam.x += (targetX - cam.x) * 0.18;
            cam.y += (targetY - cam.y) * 0.18;

            cam.x = Math.max(0, Math.min(cam.x, MAP_W * TILE - viewW));
            cam.y = Math.max(0, Math.min(cam.y, MAP_H * TILE - viewH));

            updateParticles(dt);
            updateHUD();
        }

        // ============================================================
        // MAIN RENDER
        // ============================================================
        function render() {
            const viewW = canvas.width / (window.devicePixelRatio || 1);
            const viewH = canvas.height / (window.devicePixelRatio || 1);
            ctx.clearRect(0, 0, viewW, viewH);
            ctx.fillStyle = '#1a2a10';
            ctx.fillRect(0, 0, viewW, viewH);

            const tx1 = Math.max(0, Math.floor(cam.x / TILE));
            const ty1 = Math.max(0, Math.floor(cam.y / TILE));
            const tx2 = Math.min(MAP_W - 1, Math.ceil((cam.x + viewW) / TILE));
            const ty2 = Math.min(MAP_H - 1, Math.ceil((cam.y + viewH) / TILE));

            // Ground layer
            for (let ty = ty1; ty <= ty2; ty++)
                for (let tx = tx1; tx <= tx2; tx++)
                    drawTile(tx, ty, map[ty][tx], Math.floor(tx * TILE - cam.x), Math.floor(ty * TILE - cam.y));

            // Building outlines and ground shadows
            for (let ty = ty1; ty <= ty2; ty++) {
                for (let tx = tx1; tx <= tx2; tx++) {
                    const tile = map[ty][tx];
                    const sx = Math.floor(tx * TILE - cam.x);
                    const sy = Math.floor(ty * TILE - cam.y);
                    // Dark outline on building exterior edges
                    if (isBuildingTile(tile)) {
                        ctx.fillStyle = 'rgba(25, 18, 10, 0.5)';
                        if (ty > 0 && !isBuildingTile(map[ty - 1][tx])) ctx.fillRect(sx, sy, TILE, 1);
                        if (ty < MAP_H - 1 && !isBuildingTile(map[ty + 1][tx])) ctx.fillRect(sx, sy + TILE - 1, TILE, 1);
                        if (tx > 0 && !isBuildingTile(map[ty][tx - 1])) ctx.fillRect(sx, sy, 1, TILE);
                        if (tx < MAP_W - 1 && !isBuildingTile(map[ty][tx + 1])) ctx.fillRect(sx + TILE - 1, sy, 1, TILE);
                    }
                    // Ground shadow on tiles directly south of buildings (depth shadow)
                    if (!isBuildingTile(tile) && ty > 0 && isBuildingTile(map[ty - 1][tx])) {
                        ctx.fillStyle = 'rgba(0, 0, 0, 0.12)';
                        ctx.fillRect(sx, sy, TILE, 6);
                    }
                }
            }

            // Collect all Y-sortable entities
            const entities = [];
            // Trees
            for (const t of trees) {
                if (t.x >= tx1 - 1 && t.x <= tx2 + 1 && t.y >= ty1 - 1 && t.y <= ty2 + 1) {
                    entities.push({ type: 'tree', obj: t, sortY: t.y * TILE + TILE });
                }
            }
            // Player
            entities.push({ type: 'player', sortY: player.y + player.h });

            // Sort by Y
            entities.sort((a, b) => a.sortY - b.sortY);

            // Draw sorted
            for (const e of entities) {
                if (e.type === 'tree') {
                    const t = e.obj;
                    drawTree(t, Math.floor(t.x * TILE - cam.x), Math.floor(t.y * TILE - cam.y));
                } else {
                    drawPlayer(Math.floor(player.x - cam.x), Math.floor(player.y - cam.y));
                }
            }

            // Ambient particles (butterflies, leaves)
            drawAmbient();

            // Action particles
            for (const p of particles) {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 2));
                ctx.fillRect(p.x - cam.x, p.y - cam.y, p.size, p.size);
            }
            ctx.globalAlpha = 1;

            // Day/night overlay
            drawDayNight();

            // Interaction prompt
            drawInteractionPrompt();
        }

        function gameLoop(timestamp) {
            const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
            lastTime = timestamp;
            update(dt);
            render();
            justPressed = {};
            requestAnimationFrame(gameLoop);
        }

        // ============================================================
        // INIT
        // ============================================================
        function init() {
            resize();
            initSprites();
            initMap();
            player.x = 17 * TILE;
            player.y = 14 * TILE;
            player.dir = 2;
            updateHUD();
            requestAnimationFrame(gameLoop);
        }

        window.addEventListener('keydown', e => {
            if (e.code === 'KeyE' && state.shopOpen) { closeShop(); e.preventDefault(); }
            if (e.code === 'Enter' && state.summaryOpen) { nextDay(); e.preventDefault(); }
            if (e.code === 'Escape' && state.shopOpen) closeShop();
        });

        init();
    </script>
</body>
