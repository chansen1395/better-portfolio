<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seasons At The Grove Simulator -- Lightweight Farming Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #1a1a2e;
            color: #e0e0e8;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            user-select: none
        }

        header {
            padding: 0.6rem 1.2rem;
            border-bottom: 1px solid rgba(255, 170, 60, 0.2);
            background: rgba(26, 26, 46, 0.9);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: baseline;
            gap: 1rem;
            z-index: 10
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 3px;
            background: linear-gradient(90deg, #ffaa3c, #ff6a3c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text
        }

        .subtitle {
            font-size: 0.75rem;
            color: #ffaa3c;
            letter-spacing: 2px;
            opacity: 0.7
        }

        main {
            flex: 1;
            display: flex;
            overflow: hidden;
            min-height: 0;
            position: relative
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            image-rendering: pixelated;
            cursor: default
        }

        .hud {
            position: absolute;
            top: 8px;
            left: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            pointer-events: none;
            z-index: 5
        }

        .hud-row {
            display: flex;
            gap: 8px;
            align-items: center;
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            background: rgba(20, 16, 12, 0.82);
            border: 1px solid rgba(180, 140, 80, 0.25);
            border-radius: 6px;
            padding: 4px 12px;
            backdrop-filter: blur(4px)
        }

        .hud-label {
            color: #a09070;
            font-size: 0.68rem;
            letter-spacing: 1px
        }

        .hud-val {
            color: #f0c860;
            font-weight: 700
        }

        .hud-val.money {
            color: #60d890
        }

        .shop-overlay {
            position: absolute;
            inset: 0;
            background: rgba(10, 10, 26, 0.92);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 20;
            backdrop-filter: blur(6px)
        }

        .shop-overlay.open {
            display: flex
        }

        .shop-panel {
            background: linear-gradient(135deg, rgba(40, 32, 24, 0.96), rgba(50, 40, 30, 0.94));
            border: 1.5px solid rgba(180, 140, 80, 0.3);
            border-radius: 8px;
            padding: 1.5rem 2rem;
            min-width: 340px;
            max-width: 90vw
        }

        .shop-panel h2 {
            font-size: 1.1rem;
            color: #f0c860;
            letter-spacing: 2px;
            margin-bottom: 1rem;
            text-transform: uppercase
        }

        .shop-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.6rem 0;
            border-bottom: 1px solid rgba(180, 140, 80, 0.1)
        }

        .shop-item:last-child {
            border-bottom: none
        }

        .shop-item-info {
            display: flex;
            flex-direction: column;
            gap: 2px
        }

        .shop-item-name {
            font-weight: 600;
            font-size: 0.9rem
        }

        .shop-item-desc {
            font-size: 0.7rem;
            color: #8899aa
        }

        .shop-item-price {
            font-family: 'Courier New', monospace;
            color: #60d890;
            font-weight: 700;
            font-size: 0.85rem
        }

        .shop-btn {
            padding: 4px 14px;
            background: transparent;
            border: 1.5px solid #f0c860;
            color: #f0c860;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.15s
        }

        .shop-btn:hover {
            background: rgba(240, 200, 96, 0.12);
            box-shadow: 0 0 10px rgba(240, 200, 96, 0.15)
        }

        .shop-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed
        }

        .shop-btn.owned {
            border-color: #60d890;
            color: #60d890
        }

        .shop-close {
            margin-top: 1rem;
            text-align: center
        }

        .summary-overlay {
            position: absolute;
            inset: 0;
            background: rgba(10, 10, 26, 0.92);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 25;
            backdrop-filter: blur(6px)
        }

        .summary-overlay.open {
            display: flex
        }

        .summary-panel {
            background: linear-gradient(135deg, rgba(40, 32, 24, 0.96), rgba(50, 40, 30, 0.94));
            border: 1.5px solid rgba(180, 140, 80, 0.3);
            border-radius: 8px;
            padding: 1.5rem 2rem;
            min-width: 300px;
            text-align: center
        }

        .summary-panel h2 {
            font-size: 1.1rem;
            color: #f0c860;
            letter-spacing: 2px;
            margin-bottom: 1rem
        }

        .summary-stat {
            display: flex;
            justify-content: space-between;
            padding: 0.4rem 0;
            font-size: 0.85rem;
            border-bottom: 1px solid rgba(180, 140, 80, 0.08)
        }

        .summary-stat .sl {
            color: #8899aa
        }

        .summary-stat .sv {
            color: #f0c860;
            font-weight: 700;
            font-family: 'Courier New', monospace
        }

        .summary-stat .sv.good {
            color: #60d890
        }

        .summary-stat .sv.bad {
            color: #ff4466
        }

        .summary-next {
            margin-top: 1.2rem
        }

        .controls-hint {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 1px;
            pointer-events: none;
            z-index: 5
        }
    </style>
</head>

<body>
    <header>
        <h1>Seasons At The Grove</h1>
        <span class="subtitle">Lightweight Farming Game</span>
    </header>
    <main>
        <canvas id="game"></canvas>
        <div class="hud" id="hud">
            <div class="hud-row"><span class="hud-label">DAY</span><span class="hud-val" id="hud-day">1</span></div>
            <div class="hud-row"><span class="hud-label">TIME</span><span class="hud-val" id="hud-time">6:00 AM</span>
            </div>
            <div class="hud-row"><span class="hud-label">MONEY</span><span class="hud-val money"
                    id="hud-money">$0</span></div>
            <div class="hud-row"><span class="hud-label">LOGS</span><span class="hud-val" id="hud-logs">0</span></div>
            <div class="hud-row"><span class="hud-label">SPLIT</span><span class="hud-val" id="hud-split">0</span></div>
            <div class="hud-row"><span class="hud-label">QUOTA</span><span class="hud-val" id="hud-quota">0/5</span>
            </div>
            <div class="hud-row"><span class="hud-label">TOOL</span><span class="hud-val" id="hud-tool">Axe</span></div>
        </div>
        <div class="shop-overlay" id="shop">
            <div class="shop-panel">
                <h2>General Store</h2>
                <div id="shop-items"></div>
                <div class="shop-close"><button class="shop-btn" onclick="closeShop()">Close [E]</button></div>
            </div>
        </div>
        <div class="summary-overlay" id="summary">
            <div class="summary-panel">
                <h2 id="summary-title">Day Complete</h2>
                <div id="summary-stats"></div>
                <div class="summary-next"><button class="shop-btn" onclick="nextDay()">Next Day [Enter]</button></div>
            </div>
        </div>
        <div class="controls-hint">WASD / Arrow keys to move -- E to interact -- SPACE for shop at store</div>
    </main>
    <script>
        // ============================================================
        // Seasons at the Grove -- Lightweight Farming Game
        // Stardew Valley-inspired pixel art browser game
        // Single HTML file, zero dependencies, Canvas 2D
        // ============================================================

        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;

        // --- Constants ---
        const TILE = 32;
        const MAP_W = 40;
        const MAP_H = 30;
        const PLAYER_SPEED = 3.0;
        const DAY_LENGTH = 120;
        const DAY_START_HOUR = 6;
        const DAY_END_HOUR = 22;

        // Tile types
        const T = {
            GRASS: 0, DIRT: 1, FOREST_FLOOR: 2, WATER: 3,
            WALL: 10, ROOF_HOUSE: 11, DOOR_HOUSE: 12,
            WALL_SHED: 13, DOOR_SHED: 14,
            WALL_BARN: 15, DOOR_BARN: 16,
            WALL_GARAGE: 17, DOOR_GARAGE: 18,
            TREE: 20, STUMP: 21,
            FIREPIT: 30, LOG_PILE: 31,
            STORE: 35, DOOR_STORE: 36,
            FENCE: 40, PATH: 41,
            FIELD: 42,
            KUBOTA: 50
        };

        // ============================================================
        // NOISE & HASH - deterministic decoration placement
        // ============================================================
        function isBuildingTile(t) {
            return (t >= 10 && t <= 18) || t === 35 || t === 36 || t === 50;
        }
        function hash(x, y, seed) {
            let h = (x * 374761393 + y * 668265263 + seed * 1274126177) | 0;
            h = ((h ^ (h >> 13)) * 1103515245) | 0;
            return ((h ^ (h >> 16)) >>> 0) / 4294967296;
        }
        function hashInt(x, y, seed, max) { return Math.floor(hash(x, y, seed) * max); }

        // ============================================================
        // RICH COLOR PALETTE - Stardew Valley inspired warm tones
        // ============================================================
        const PAL = {
            // Grass layers (warm, saturated greens)
            grass1: '#5aaa3a', grass2: '#4e9a32', grass3: '#68b848',
            grassShadow: '#3a8a22', grassHighlight: '#7acc58',
            // Forest
            forestFloor1: '#2e6a1e', forestFloor2: '#286218', forestFloor3: '#347220',
            forestMoss: '#4a8a30',
            // Dirt/Path
            pathBase: '#c4a366', pathLight: '#d4b878', pathDark: '#a88a50',
            pathPebble1: '#b09458', pathPebble2: '#8a7040',
            // Water
            waterDeep: '#2868a8', waterMid: '#3878b8', waterLight: '#58a0d8',
            waterFoam: '#b0d8f0', waterShore: '#88c0e0',
            // Wood / Logs
            woodLight: '#a87848', woodMid: '#8a5e38', woodDark: '#6a4428',
            woodGrain: '#7a5030', bark: '#5a3820',
            // Leaves
            leaf1: '#2a8a30', leaf2: '#38a840', leaf3: '#50c058',
            leafShadow: '#1a6a20', leafHighlight: '#68d868',
            leafAutumn1: '#d8a830', leafAutumn2: '#c88020',
            // Buildings
            stoneBase: '#8a8478', stoneDark: '#6a6460', stoneLight: '#a8a098',
            wallWood: '#9a7a58', wallWoodLight: '#b89a70', wallWoodDark: '#7a6040',
            roofRed: '#b84838', roofRedLight: '#c85848', roofRedDark: '#983828',
            roofBrown: '#8a6a48', roofBrownLight: '#9a7a58',
            windowGlass: '#80b8d8', windowGlow: '#f8e8a0', windowFrame: '#5a4a38',
            door: '#6a4e30', doorDark: '#4a3420', doorHandle: '#d0b060',
            // Barn
            barnRed: '#b83828', barnRedLight: '#c84838', barnRedDark: '#982818',
            barnTrim: '#e8d8c0',
            // Shed
            shedWood: '#8a7a60', shedWoodDark: '#6a5a40', shedRoof: '#6a6a68',
            // Garage
            garageMetal: '#7a7a80', garageMetalDark: '#5a5a60', garageMetalLight: '#9a9aa0',
            // Kubota
            kubotaOrange: '#e87828', kubotaOrangeLight: '#f89040', kubotaOrangeDark: '#c86018',
            kubotaTire: '#2a2a28', kubotaGlass: '#a0c8e0',
            // Store
            storeWood: '#7a6a58', storeRoof: '#5a7a5a', storeSign: '#d8c080',
            // Fence
            fenceWood: '#9a7a50', fenceDark: '#7a5a38', fenceLight: '#b89a68',
            // Field
            fieldSoil: '#7a5a30', fieldSoilDark: '#5a4020', fieldGreen: '#68a838',
            // Firepit
            stone1: '#6a6860', stone2: '#7a7870', ash: '#3a3838',
            ember1: '#f06020', ember2: '#f8a040', ember3: '#f8d060',
            // Player
            skinLight: '#f0c8a0', skinMid: '#e0b088', skinShadow: '#c89868',
            hair: '#5a3828', hatBrim: '#c8a860', hatTop: '#b89850',
            shirtBlue: '#4878b8', shirtBlueDark: '#3060a0',
            pantsJean: '#506898', pantsJeanDark: '#405880',
            boots: '#5a4030',
            // Flowers
            flowerRed: '#e85858', flowerYellow: '#f8d848', flowerPink: '#f090b0',
            flowerPurple: '#a070c8', flowerWhite: '#f0f0e8', flowerBlue: '#70a0e0',
            flowerStem: '#408830',
            // Misc
            shadow: 'rgba(0,0,0,0.18)',
            mushroom1: '#d8a870', mushroom2: '#e8c090', mushroomCap: '#c84040',
            rock1: '#8a8880', rock2: '#9a9890', rock3: '#7a7870',
        };

        // ============================================================
        // SPRITE CACHE SYSTEM — ImageData-based pixel-perfect rendering
        // ============================================================

        // Parse hex color to [r,g,b]
        function hexRgb(hex) {
            const n = parseInt(hex.slice(1), 16);
            return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
        }

        // Bayer 4×4 ordered dithering matrix (normalized 0–1)
        const BAYER4 = [
            [0 / 16, 8 / 16, 2 / 16, 10 / 16],
            [12 / 16, 4 / 16, 14 / 16, 6 / 16],
            [3 / 16, 11 / 16, 1 / 16, 9 / 16],
            [15 / 16, 7 / 16, 13 / 16, 5 / 16]
        ];

        // Interpolate two RGB arrays
        function lerpRgb(a, b, t) {
            return [
                Math.round(a[0] + (b[0] - a[0]) * t),
                Math.round(a[1] + (b[1] - a[1]) * t),
                Math.round(a[2] + (b[2] - a[2]) * t)
            ];
        }

        // Quick hash for sprite generation (same algorithm, different namespace)
        function sHash(x, y, s) {
            let h = (x * 374761393 + y * 668265263 + s * 1274126177) | 0;
            h = ((h ^ (h >> 13)) * 1103515245) | 0;
            return ((h ^ (h >> 16)) >>> 0) / 4294967296;
        }
        function sHashI(x, y, s, m) { return Math.floor(sHash(x, y, s) * m); }

        // Generate a tile sprite using ImageData — pixel-perfect, zero anti-aliasing
        function genSprite(w, h, pixelFn) {
            const c = document.createElement('canvas');
            c.width = w; c.height = h;
            const sctx = c.getContext('2d');
            sctx.imageSmoothingEnabled = false;
            const img = sctx.createImageData(w, h);
            const d = img.data;
            for (let py = 0; py < h; py++) {
                for (let px = 0; px < w; px++) {
                    const col = pixelFn(px, py);
                    if (!col) continue; // transparent
                    const i = (py * w + px) * 4;
                    d[i] = col[0]; d[i + 1] = col[1]; d[i + 2] = col[2];
                    d[i + 3] = col.length > 3 ? col[3] : 255;
                }
            }
            sctx.putImageData(img, 0, 0);
            return c;
        }

        // Generate sprite on off-screen canvas using fillRect (for complex overlays)
        function genCanvasSprite(w, h, drawFn) {
            const c = document.createElement('canvas');
            c.width = w; c.height = h;
            const sctx = c.getContext('2d');
            sctx.imageSmoothingEnabled = false;
            drawFn(sctx, w, h);
            return c;
        }

        // =====  SPRITE CACHES =====
        const SC = {
            grass: [],      // 8 variants
            forest: [],     // 6 variants
            path: [],       // 6 variants
            field: [],      // 4 variants
            water: [],      // 4 frames (animated)
            oakTree: [],    // 4 variants
            pineTree: [],   // 4 variants
            mapleTree: [],  // 4 variants
        };

        // ===== GRASS SPRITES — rich Bayer-dithered texture =====
        function genGrassSprites() {
            const g = [
                hexRgb('#3a7a22'), // 0: deep shadow
                hexRgb('#448a2a'), // 1: dark mid
                hexRgb('#4e9a32'), // 2: grass2
                hexRgb('#5aaa3a'), // 3: grass1 (base)
                hexRgb('#68b848'), // 4: grass3 (warm)
                hexRgb('#78cc55'), // 5: highlight
                hexRgb('#88d868'), // 6: bright tip
                hexRgb('#2e6418'), // 7: ground dark (between blades)
            ];

            for (let v = 0; v < 8; v++) {
                SC.grass[v] = genSprite(TILE, TILE, (x, y) => {
                    // Layer 1: Bayer-dithered base gradient
                    const bayer = BAYER4[y % 4][x % 4];
                    const n1 = sHash(x + v * 37, y + v * 53, 1);
                    const combined = n1 * 0.5 + bayer * 0.5;
                    // Bias shade selection: mostly mids (2-4), few darks
                    let ci;
                    if (combined < 0.10) ci = 1;
                    else if (combined < 0.25) ci = 2;
                    else if (combined < 0.45) ci = 3;
                    else if (combined < 0.65) ci = 4;
                    else if (combined < 0.82) ci = 5;
                    else ci = 6;
                    let color = g[ci];

                    // Layer 2: Larger soft shadow patches (dappled light feel)
                    const patchX = Math.floor(x / 8), patchY = Math.floor(y / 8);
                    const patchNoise = sHash(patchX + v * 11, patchY + v * 7, 70);
                    if (patchNoise > 0.72) color = lerpRgb(color, g[1], 0.15);
                    else if (patchNoise < 0.18) color = lerpRgb(color, g[5], 0.15);

                    // Layer 3: Individual grass blade silhouettes
                    const bladeRoll = sHash(x, 0, v * 100 + 50);
                    if (bladeRoll > 0.52) {
                        const bh = Math.floor(sHash(x, 0, v * 100 + 51) * 6) + 3; // 3-8 px tall
                        const bStart = TILE - bh;
                        if (y >= bStart) {
                            const relY = y - bStart;
                            const isLight = sHash(x, 0, v * 100 + 52) > 0.4;
                            if (relY === 0) color = g[6]; // bright tip
                            else if (relY <= 1 && isLight) color = g[5]; // upper highlight
                            else if (relY <= 2) color = isLight ? g[4] : g[2];
                            else color = g[relY > bh * 0.6 ? 0 : 1]; // lower dark
                        }
                    }

                    // Layer 4: Subtle ground shadow at very bottom between blades
                    if (y >= TILE - 2) {
                        const groundRoll = sHash(x, y, v * 100 + 80);
                        if (groundRoll > 0.6) color = lerpRgb(color, g[7], 0.2);
                    }

                    // Layer 5: Occasional highlight scatter (breaks up regularity)
                    const scatter = sHash(x * 3 + v * 11, y * 7 + v * 13, 30);
                    if (scatter > 0.94) color = lerpRgb(color, g[5], 0.5);

                    return color;
                });
            }
        }

        // ===== FOREST FLOOR SPRITES =====
        function genForestSprites() {
            const f = [
                hexRgb('#1e5410'), // 0: deepest shadow
                hexRgb('#286218'), // 1: dark
                hexRgb('#2e6a1e'), // 2: forestFloor1
                hexRgb('#347220'), // 3: forestFloor3
                hexRgb('#3a7a28'), // 4: mid
                hexRgb('#4a8a30'), // 5: moss highlight
                hexRgb('#1a4a0e'), // 6: ground dark
            ];

            for (let v = 0; v < 6; v++) {
                SC.forest[v] = genSprite(TILE, TILE, (x, y) => {
                    const bayer = BAYER4[y % 4][x % 4];
                    const n1 = sHash(x + v * 41, y + v * 59, 2);
                    const combined = n1 * 0.55 + bayer * 0.45;
                    let ci;
                    if (combined < 0.18) ci = 0;
                    else if (combined < 0.35) ci = 1;
                    else if (combined < 0.52) ci = 2;
                    else if (combined < 0.70) ci = 3;
                    else if (combined < 0.85) ci = 4;
                    else ci = 5;
                    let color = f[ci];

                    // Moss patches
                    const mossX = Math.floor(x / 6), mossY = Math.floor(y / 6);
                    if (sHash(mossX + v * 3, mossY + v * 5, 40) > 0.7) color = lerpRgb(color, f[5], 0.35);

                    // Dark ground spots
                    const darkX = Math.floor(x / 5), darkY = Math.floor(y / 5);
                    if (sHash(darkX + v * 7, darkY + v * 9, 55) > 0.82) color = lerpRgb(color, f[6], 0.3);

                    // Scatter variation (highlights only)
                    const sc = sHash(x * 5 + v * 13, y * 3 + v * 17, 60);
                    if (sc > 0.95) color = lerpRgb(color, f[5], 0.5);

                    // Fallen leaf pixels
                    if (sHash(x, y, v * 100 + 90) > 0.985) {
                        const leafType = sHashI(x, y, v * 100 + 91, 3);
                        if (leafType === 0) color = hexRgb('#d8a830'); // autumn gold
                        else if (leafType === 1) color = hexRgb('#c88020'); // autumn orange
                        else color = hexRgb('#2a8a30'); // green leaf
                    }

                    return color;
                });
            }
        }

        // ===== PATH SPRITES =====
        function genPathSprites() {
            const p = [
                hexRgb('#8a7040'), // 0: dark dirt
                hexRgb('#a88a50'), // 1: pathDark
                hexRgb('#b09458'), // 2: pebble1
                hexRgb('#c4a366'), // 3: pathBase
                hexRgb('#d4b878'), // 4: pathLight
                hexRgb('#dcc888'), // 5: bright highlight
            ];

            for (let v = 0; v < 6; v++) {
                SC.path[v] = genSprite(TILE, TILE, (x, y) => {
                    const bayer = BAYER4[y % 4][x % 4];
                    const n1 = sHash(x + v * 31, y + v * 47, 3);
                    const combined = n1 * 0.5 + bayer * 0.5;
                    let ci;
                    if (combined < 0.12) ci = 0;
                    else if (combined < 0.30) ci = 1;
                    else if (combined < 0.50) ci = 2;
                    else if (combined < 0.72) ci = 3;
                    else if (combined < 0.88) ci = 4;
                    else ci = 5;
                    let color = p[ci];

                    // Central lightening
                    const cx = x - TILE / 2, cy = y - TILE / 2;
                    const dist = Math.sqrt(cx * cx + cy * cy) / (TILE * 0.7);
                    if (dist < 0.5) color = lerpRgb(color, p[4], 0.15);

                    // Pebble spots (larger feature noise)
                    if (sHash(x, y, v * 100 + 20) > 0.97) {
                        color = sHash(x, y, v * 100 + 21) > 0.5 ? p[1] : p[4];
                    }

                    // Subtle highlight scatter
                    const sc = sHash(x * 3 + v * 5, y * 7 + v * 11, 45);
                    if (sc > 0.95) color = lerpRgb(color, p[4], 0.4);

                    return color;
                });
            }
        }

        // ===== FIELD SPRITES (soil furrows + grass between) =====
        function genFieldSprites() {
            const soil = [hexRgb('#4a3018'), hexRgb('#5a4020'), hexRgb('#7a5a30'), hexRgb('#8a6a3a'), hexRgb('#9a7a48')];
            const grass = [hexRgb('#3a7a22'), hexRgb('#4e9a32'), hexRgb('#5aaa3a'), hexRgb('#68b848')];

            for (let v = 0; v < 4; v++) {
                SC.field[v] = genSprite(TILE, TILE, (x, y) => {
                    // Alternating furrow rows (every 10px: 6px soil, 4px grass)
                    const rowPhase = y % 10;
                    const isSoil = rowPhase < 6;

                    if (isSoil) {
                        const bayer = BAYER4[y % 4][x % 4];
                        const n = sHash(x + v * 23, y + v * 37, 4) * 0.5 + bayer * 0.5;
                        let ci;
                        if (n < 0.15) ci = 0;
                        else if (n < 0.35) ci = 1;
                        else if (n < 0.60) ci = 2;
                        else if (n < 0.82) ci = 3;
                        else ci = 4;
                        let color = soil[ci];
                        // Top of mound highlight
                        if (rowPhase === 0) color = lerpRgb(color, soil[4], 0.3);
                        // Bottom shadow
                        if (rowPhase === 5) color = lerpRgb(color, soil[0], 0.3);
                        return color;
                    } else {
                        // Grass between furrows
                        const bayer = BAYER4[y % 4][x % 4];
                        const n = sHash(x + v * 29, y + v * 43, 5) * 0.5 + bayer * 0.5;
                        let ci = n < 0.25 ? 0 : n < 0.5 ? 1 : n < 0.75 ? 2 : 3;
                        // Occasional crop sprout
                        if (sHash(x, y, v * 100 + 30) > 0.96) {
                            return hexRgb('#408830'); // dark stem
                        }
                        return grass[ci];
                    }
                });
            }
        }

        // ===== WATER SPRITES (animated, 4 frames) =====
        function genWaterSprites() {
            const w = [
                hexRgb('#1e5898'), // 0: deepest
                hexRgb('#2868a8'), // 1: deep
                hexRgb('#3878b8'), // 2: mid
                hexRgb('#4888c8'), // 3: light mid
                hexRgb('#58a0d8'), // 4: light
                hexRgb('#78b8e0'), // 5: highlight
                hexRgb('#b0d8f0'), // 6: foam/sparkle
            ];

            for (let frame = 0; frame < 4; frame++) {
                SC.water[frame] = genSprite(TILE, TILE, (x, y) => {
                    const bayer = BAYER4[y % 4][x % 4];
                    const n = sHash(x, y, frame * 100 + 6) * 0.45 + bayer * 0.45;
                    // Wave offset: shift the y coordinate per frame for animation
                    const wy = (y + frame * 3) % TILE;
                    const waveN = sHash(x, wy, 7) * 0.1;
                    const combined = n + waveN;
                    let ci;
                    if (combined < 0.15) ci = 0;
                    else if (combined < 0.30) ci = 1;
                    else if (combined < 0.48) ci = 2;
                    else if (combined < 0.65) ci = 3;
                    else if (combined < 0.80) ci = 4;
                    else if (combined < 0.93) ci = 5;
                    else ci = 6;
                    let color = w[ci];

                    // Horizontal ripple lines (shift per frame)
                    const rippleRow = (y + frame * 2) % 8;
                    if (rippleRow < 2) color = lerpRgb(color, w[5], 0.2);

                    // Sparkle pixels
                    if (sHash(x + frame * 7, y + frame * 11, 50) > 0.97) color = w[6];

                    return color;
                });
            }
        }

        // ===== TREE CANOPY SPRITES (organic blob shapes) =====
        function genTreeSprites() {
            // Each tree sprite: 48 wide × 56 tall (trunk + canopy, origin at bottom-center of trunk)
            const TW = 48, TH = 56;

            function genLeafCanopy(sctx, cx, cy, radius, colors, seed) {
                // Draw an organic canopy using overlapping pixel blobs
                // Step 1: Draw base shape (filled pixel circle with noise on edge)
                const img = sctx.getImageData(0, 0, TW, TH);
                const d = img.data;
                for (let py = cy - radius - 4; py <= cy + radius + 4; py++) {
                    for (let px = cx - radius - 4; px <= cx + radius + 4; px++) {
                        if (px < 0 || py < 0 || px >= TW || py >= TH) continue;
                        const dx = px - cx, dy = py - cy;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        // Organic edge: radius varies by angle
                        const angle = Math.atan2(dy, dx);
                        const edgeNoise = sHash(Math.round(angle * 8 + 50), seed, 100) * 0.28 + 0.86;
                        const eff = radius * edgeNoise;
                        // Extra lobes for organic shape
                        const lobe1 = Math.cos(angle * 3 + seed) * radius * 0.12;
                        const lobe2 = Math.sin(angle * 5 + seed * 2) * radius * 0.08;
                        const finalR = eff + lobe1 + lobe2;
                        if (dist > finalR + 1) continue;

                        // Color based on depth/light
                        const t = dist / finalR;
                        const lightAngle = -Math.PI * 0.7; // light from upper-left
                        const lightDot = Math.cos(angle - lightAngle) * 0.5 + 0.5;
                        const bayer = BAYER4[py % 4][px % 4];
                        const shade = t * 0.3 + (1 - lightDot) * 0.3 + bayer * 0.15 + sHash(px, py, seed + 10) * 0.25;

                        const ci = Math.min(Math.floor(shade * colors.length), colors.length - 1);
                        const col = colors[ci];

                        // Edge pixel scatter (semi-transparent for soft edge)
                        let alpha = 255;
                        if (dist > finalR - 1.5) alpha = Math.round(Math.max(0, (finalR + 0.5 - dist)) * 255);

                        const i = (py * TW + px) * 4;
                        // Alpha composite onto existing
                        if (d[i + 3] === 0 || alpha >= 255) {
                            d[i] = col[0]; d[i + 1] = col[1]; d[i + 2] = col[2]; d[i + 3] = alpha;
                        } else if (alpha > 0) {
                            const srcA = alpha / 255, dstA = d[i + 3] / 255;
                            const outA = srcA + dstA * (1 - srcA);
                            d[i] = Math.round((col[0] * srcA + d[i] * dstA * (1 - srcA)) / outA);
                            d[i + 1] = Math.round((col[1] * srcA + d[i + 1] * dstA * (1 - srcA)) / outA);
                            d[i + 2] = Math.round((col[2] * srcA + d[i + 2] * dstA * (1 - srcA)) / outA);
                            d[i + 3] = Math.round(outA * 255);
                        }
                    }
                }
                sctx.putImageData(img, 0, 0);

                // Step 2: Scatter individual leaf pixels around the edge for organic silhouette
                for (let i = 0; i < 28; i++) {
                    const a = sHash(i, seed, 200) * Math.PI * 2;
                    const r = radius + sHash(i, seed, 201) * 5 - 1;
                    const lx = Math.round(cx + Math.cos(a) * r);
                    const ly = Math.round(cy + Math.sin(a) * r * 0.8);
                    if (lx < 0 || ly < 0 || lx >= TW || ly >= TH) continue;
                    const col = colors[sHashI(i, seed, 202, colors.length)];
                    sctx.fillStyle = `rgb(${col[0]},${col[1]},${col[2]})`;
                    const sz = sHash(i, seed, 203) > 0.6 ? 2 : 1;
                    sctx.fillRect(lx, ly, sz, sz);
                }

                // Step 3: Interior detail pixels (leaf texture variation)
                for (let i = 0; i < 22; i++) {
                    const px = cx - radius + sHashI(i, seed, 210, radius * 2);
                    const py = cy - radius + sHashI(i, seed, 211, radius * 2);
                    const dx = px - cx, dy = py - cy;
                    if (Math.sqrt(dx * dx + dy * dy) > radius * 0.85) continue;
                    if (px < 0 || py < 0 || px >= TW || py >= TH) continue;
                    const col = colors[sHashI(i, seed, 212, colors.length)];
                    sctx.fillStyle = `rgb(${col[0]},${col[1]},${col[2]})`;
                    sctx.fillRect(px, py, 1, 1);
                }
            }

            // Oak tree colors (green, lush)
            const oakLeaf = [
                hexRgb('#1a5a18'), // deep shadow
                hexRgb('#226a22'), // shadow
                hexRgb('#2a8a30'), // leaf1
                hexRgb('#38a840'), // leaf2
                hexRgb('#50c058'), // leaf3
                hexRgb('#68d868'), // highlight
            ];

            for (let v = 0; v < 4; v++) {
                SC.oakTree[v] = genCanvasSprite(TW, TH, (sctx) => {
                    // Trunk
                    sctx.fillStyle = PAL.bark;
                    sctx.fillRect(20, 30, 8, 24);
                    sctx.fillStyle = PAL.woodDark;
                    sctx.fillRect(21, 30, 6, 23);
                    sctx.fillStyle = PAL.woodMid;
                    sctx.fillRect(22, 32, 2, 20);
                    // Bark detail
                    sctx.fillStyle = PAL.bark;
                    sctx.fillRect(23, 36, 1, 2);
                    sctx.fillRect(21, 40, 1, 1);
                    sctx.fillRect(25, 44, 1, 2);
                    // Roots
                    sctx.fillStyle = PAL.bark;
                    sctx.fillRect(18, 50, 4, 4);
                    sctx.fillRect(26, 51, 4, 3);

                    // Canopy: multiple overlapping blobs
                    genLeafCanopy(sctx, 24, 16, 16, oakLeaf, v * 100 + 1);
                    // Secondary lobe left
                    genLeafCanopy(sctx, 14, 18, 10, oakLeaf, v * 100 + 2);
                    // Secondary lobe right
                    genLeafCanopy(sctx, 34, 18, 10, oakLeaf, v * 100 + 3);
                });
            }

            // Pine tree colors (blue-green, darker)
            const pineLeaf = [
                hexRgb('#0e3a10'), // deep
                hexRgb('#1a5a20'), // dark
                hexRgb('#2a7a30'), // mid
                hexRgb('#3a9a40'), // light
                hexRgb('#4aaa48'), // bright
                hexRgb('#5aba58'), // tip highlight
            ];

            function drawPixelTriangle(sctx, cx, topY, baseW, h, colors, seed) {
                const img = sctx.getImageData(0, 0, TW, TH);
                const d = img.data;
                for (let dy = 0; dy < h; dy++) {
                    const t = dy / h;
                    const halfW = Math.round(baseW * t / 2);
                    for (let dx = -halfW; dx <= halfW; dx++) {
                        const px = cx + dx, py = topY + dy;
                        if (px < 0 || py < 0 || px >= TW || py >= TH) continue;
                        // Edge noise for organic shape
                        const edgeDist = Math.abs(dx) / Math.max(halfW, 1);
                        const noise = sHash(px, py, seed) * 0.3;
                        if (edgeDist > 0.85 && noise > 0.15) continue; // Skip some edge pixels
                        // Color based on depth
                        const bayer = BAYER4[py % 4][px % 4];
                        const shade = (1 - t) * 0.3 + edgeDist * 0.2 + bayer * 0.2 + noise;
                        const ci = Math.min(Math.floor(shade * colors.length), colors.length - 1);
                        const col = colors[ci];
                        const i = (py * TW + px) * 4;
                        d[i] = col[0]; d[i + 1] = col[1]; d[i + 2] = col[2]; d[i + 3] = 255;
                    }
                }
                sctx.putImageData(img, 0, 0);

                // Needle scatter around edges
                for (let i = 0; i < 16; i++) {
                    const ny = topY + sHashI(i, seed, 300, h);
                    const wAtY = Math.round(baseW * ((ny - topY) / h) / 2);
                    const side = sHash(i, seed, 301) > 0.5 ? 1 : -1;
                    const nx = cx + side * (wAtY + sHashI(i, seed, 302, 3));
                    if (nx < 0 || ny < 0 || nx >= TW || ny >= TH) continue;
                    const col = colors[sHashI(i, seed, 303, colors.length)];
                    sctx.fillStyle = `rgb(${col[0]},${col[1]},${col[2]})`;
                    sctx.fillRect(nx, ny, 1, sHash(i, seed, 304) > 0.5 ? 2 : 1);
                }
            }

            for (let v = 0; v < 4; v++) {
                SC.pineTree[v] = genCanvasSprite(TW, TH, (sctx) => {
                    // Trunk
                    sctx.fillStyle = PAL.bark;
                    sctx.fillRect(21, 30, 6, 24);
                    sctx.fillStyle = PAL.woodDark;
                    sctx.fillRect(22, 30, 4, 23);
                    // Bark detail
                    sctx.fillStyle = PAL.bark;
                    sctx.fillRect(23, 36, 1, 2);
                    sctx.fillRect(22, 42, 1, 1);

                    // Three triangle layers
                    drawPixelTriangle(sctx, 24, 30, 26, 12, pineLeaf, v * 100 + 10);
                    drawPixelTriangle(sctx, 24, 22, 22, 12, pineLeaf, v * 100 + 11);
                    drawPixelTriangle(sctx, 24, 14, 16, 12, pineLeaf, v * 100 + 12);
                    drawPixelTriangle(sctx, 24, 8, 10, 8, pineLeaf, v * 100 + 13);
                });
            }

            // Maple tree colors (mixed green + autumn)
            const mapleLeaf = [
                hexRgb('#1a5a18'), // deep shadow
                hexRgb('#2a7a28'), // shadow
                hexRgb('#5aaa38'), // base green
                hexRgb('#68b848'), // bright green
                hexRgb('#d8a830'), // autumn gold
                hexRgb('#e8c048'), // autumn light
            ];

            for (let v = 0; v < 4; v++) {
                SC.mapleTree[v] = genCanvasSprite(TW, TH, (sctx) => {
                    // Trunk
                    sctx.fillStyle = PAL.bark;
                    sctx.fillRect(20, 28, 8, 26);
                    sctx.fillStyle = PAL.woodDark;
                    sctx.fillRect(21, 28, 6, 25);
                    sctx.fillStyle = PAL.woodMid;
                    sctx.fillRect(23, 30, 2, 22);
                    // Branch stubs
                    sctx.fillStyle = PAL.bark;
                    sctx.fillRect(14, 34, 8, 3);
                    sctx.fillRect(26, 32, 8, 3);
                    // Bark detail
                    sctx.fillStyle = PAL.bark;
                    sctx.fillRect(23, 34, 1, 2);
                    sctx.fillRect(21, 42, 1, 1);

                    // Canopy: overlapping blobs with autumn mix
                    genLeafCanopy(sctx, 24, 16, 18, mapleLeaf, v * 100 + 20);
                    genLeafCanopy(sctx, 12, 20, 10, mapleLeaf, v * 100 + 21);
                    genLeafCanopy(sctx, 36, 20, 10, mapleLeaf, v * 100 + 22);
                });
            }
        }

        // ===== INIT ALL SPRITES =====
        function initSprites() {
            genGrassSprites();
            genForestSprites();
            genPathSprites();
            genFieldSprites();
            genWaterSprites();
            genTreeSprites();
        }

        // ============================================================
        // GAME STATE (unchanged gameplay)
        // ============================================================
        let state = {
            day: 1, time: 0, money: 0, logs: 0, splitLogs: 0, totalSplitToday: 0,
            logsAtFirepit: 0, quota: 5, quotaMet: false,
            tool: 'axe', hasSplitter: false, hasChainsaw: false,
            chopProgress: 0, splitProgress: 0, isChopping: false, isSplitting: false,
            chopHit: false, splitHit: false, lastChopStrike: -1,
            dayOver: false, shopOpen: false, summaryOpen: false,
            carrying: 0, maxCarry: 3,
        };

        let player = { x: 14 * TILE, y: 16 * TILE, dir: 2, w: 16, h: 28, moving: false, frame: 0, walkTimer: 0 };
        let trees = [];
        let cam = { x: 0, y: 0 };
        let keys = {}, justPressed = {};
        let particles = [];
        let ambientParticles = []; // butterflies, leaves
        let map = [];
        let globalTime = 0; // for animation

        // ============================================================
        // MAP GENERATION (same layout)
        // ============================================================
        function initMap() {
            map = [];
            for (let y = 0; y < MAP_H; y++) {
                map[y] = [];
                for (let x = 0; x < MAP_W; x++) map[y][x] = T.GRASS;
            }
            for (let y = 2; y < 22; y++)
                for (let x = 0; x < 12; x++) map[y][x] = T.FOREST_FLOOR;
            for (let y = 4; y < 12; y++)
                for (let x = 28; x < 38; x++) map[y][x] = T.FIELD;
            for (let y = 25; y < 29; y++)
                for (let x = 28; x < 36; x++)
                    if (Math.abs(x - 32) + Math.abs(y - 27) < 5) map[y][x] = T.WATER;

            // Paths
            for (let x = 12; x < 26; x++) map[17][x] = T.PATH;
            for (let y = 10; y < 24; y++) map[y][18] = T.PATH;
            for (let x = 15; x < 22; x++) map[13][x] = T.PATH;
            for (let x = 16; x < 21; x++) map[21][x] = T.PATH;

            placeBuilding(15, 10, 5, 4, T.WALL, T.ROOF_HOUSE, T.DOOR_HOUSE, 2);
            placeBuilding(22, 10, 4, 3, T.WALL_SHED, T.WALL_SHED, T.DOOR_SHED, 1);
            placeBuilding(14, 19, 5, 3, T.WALL_BARN, T.WALL_BARN, T.DOOR_BARN, 2);
            placeBuilding(21, 19, 4, 3, T.WALL_GARAGE, T.WALL_GARAGE, T.DOOR_GARAGE, 1);
            map[20][22] = T.KUBOTA;
            map[9][18] = T.FIREPIT;
            placeBuilding(30, 16, 4, 3, T.STORE, T.STORE, T.DOOR_STORE, 1);

            for (let x = 12; x < 27; x++) {
                if (map[8][x] === T.GRASS) map[8][x] = T.FENCE;
                if (map[24][x] === T.GRASS) map[24][x] = T.FENCE;
            }
            for (let y = 8; y < 25; y++) {
                if (map[y][12] === T.GRASS || map[y][12] === T.FOREST_FLOOR) map[y][12] = T.FENCE;
                if (map[y][26] === T.GRASS) map[y][26] = T.FENCE;
            }
            map[17][12] = T.PATH;
            map[17][26] = T.PATH;
            map[8][18] = T.GRASS;

            trees = [];
            spawnTrees();
            initAmbient();
        }

        function placeBuilding(bx, by, w, h, wallTile, roofTile, doorTile, doorOffset) {
            for (let dy = 0; dy < h; dy++)
                for (let dx = 0; dx < w; dx++) {
                    if (dy === 0) map[by + dy][bx + dx] = roofTile;
                    else if (dy === h - 1 && dx === doorOffset) map[by + dy][bx + dx] = doorTile;
                    else map[by + dy][bx + dx] = wallTile;
                }
        }

        function spawnTrees() {
            for (let y = 3; y < 21; y++)
                for (let x = 1; x < 11; x++)
                    if (Math.random() < 0.35 && map[y][x] === T.FOREST_FLOOR)
                        trees.push({ x, y, alive: true, health: 3, type: hashInt(x, y, 42, 3), sway: 0, hitTimer: 0, hitDir: 1 });
        }

        function initAmbient() {
            ambientParticles = [];
            // Butterflies
            for (let i = 0; i < 8; i++) {
                ambientParticles.push({
                    type: 'butterfly',
                    x: 14 * TILE + Math.random() * 12 * TILE,
                    y: 10 * TILE + Math.random() * 12 * TILE,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.3,
                    phase: Math.random() * Math.PI * 2,
                    color: ['#f8d848', '#f090b0', '#70a0e0', '#e8e8e0'][Math.floor(Math.random() * 4)],
                });
            }
            // Forest leaf drift
            for (let i = 0; i < 6; i++) {
                ambientParticles.push({
                    type: 'leaf',
                    x: Math.random() * 11 * TILE,
                    y: 3 * TILE + Math.random() * 16 * TILE,
                    vx: 0.2 + Math.random() * 0.3,
                    vy: 0.3 + Math.random() * 0.4,
                    phase: Math.random() * Math.PI * 2,
                    color: hash(i, 0, 99) > 0.5 ? PAL.leaf1 : PAL.leafAutumn1,
                });
            }
        }

        // ============================================================
        // COLLISION (unchanged)
        // ============================================================
        function isSolid(tx, ty) {
            if (tx < 0 || ty < 0 || tx >= MAP_W || ty >= MAP_H) return true;
            const t = map[ty][tx];
            if (t === T.WATER || t === T.FENCE) return true;
            if (t === T.WALL || t === T.ROOF_HOUSE || t === T.WALL_SHED || t === T.WALL_BARN || t === T.WALL_GARAGE || t === T.STORE) return true;
            if (t === T.KUBOTA) return true;
            for (const tr of trees) { if (tr.alive && tr.x === tx && tr.y === ty) return true; }
            return false;
        }
        function canWalk(px, py) {
            const m = 4;
            const l = Math.floor((px + m) / TILE), r = Math.floor((px + player.w - m) / TILE);
            const t = Math.floor((py + m) / TILE), b = Math.floor((py + player.h - m) / TILE);
            for (let ty = t; ty <= b; ty++) for (let tx = l; tx <= r; tx++) if (isSolid(tx, ty)) return false;
            return true;
        }

        // ============================================================
        // INTERACTION HELPERS (unchanged)
        // ============================================================
        function facingTile() {
            const cx = player.x + player.w / 2, cy = player.y + player.h / 2;
            const dirs = [[0, -1], [1, 0], [0, 1], [-1, 0]];
            const d = dirs[player.dir];
            return { x: Math.floor(cx / TILE) + d[0], y: Math.floor(cy / TILE) + d[1] };
        }
        function playerTile() {
            return { x: Math.floor((player.x + player.w / 2) / TILE), y: Math.floor((player.y + player.h / 2) / TILE) };
        }
        function treeAt(tx, ty) { return trees.find(t => t.alive && t.x === tx && t.y === ty); }
        function nearTile(targetType, range) {
            const pt = playerTile();
            for (let dy = -range; dy <= range; dy++) for (let dx = -range; dx <= range; dx++) {
                const tx = pt.x + dx, ty = pt.y + dy;
                if (tx >= 0 && ty >= 0 && tx < MAP_W && ty < MAP_H && map[ty][tx] === targetType) return true;
            }
            return false;
        }

        // ============================================================
        // SHOP (unchanged)
        // ============================================================
        const shopItems = [
            {
                id: 'chainsaw', name: 'Chainsaw', desc: 'Chops trees 3x faster', price: 50,
                check: () => !state.hasChainsaw, apply: () => { state.hasChainsaw = true; state.tool = 'chainsaw'; }
            },
            {
                id: 'splitter', name: 'Log Splitter', desc: 'Splits logs 3x faster at the shed', price: 80,
                check: () => !state.hasSplitter, apply: () => { state.hasSplitter = true; }
            },
            {
                id: 'upgrade_carry', name: 'Bigger Cart', desc: 'Carry 6 logs at a time', price: 40,
                check: () => state.maxCarry < 6, apply: () => { state.maxCarry = 6; }
            },
            {
                id: 'upgrade_carry2', name: 'Truck Bed Rack', desc: 'Carry 10 logs at a time', price: 120,
                check: () => state.maxCarry < 10, apply: () => { state.maxCarry = 10; }
            },
        ];
        function openShop() { state.shopOpen = true; document.getElementById('shop').classList.add('open'); renderShop(); }
        function closeShop() { state.shopOpen = false; document.getElementById('shop').classList.remove('open'); }
        function renderShop() {
            const cont = document.getElementById('shop-items'); cont.innerHTML = '';
            for (const item of shopItems) {
                const avail = item.check(), canAfford = state.money >= item.price;
                const div = document.createElement('div'); div.className = 'shop-item';
                div.innerHTML = `<div class="shop-item-info"><div class="shop-item-name">${item.name}</div><div class="shop-item-desc">${item.desc}</div></div><div style="display:flex;align-items:center;gap:8px"><span class="shop-item-price">$${item.price}</span><button class="shop-btn ${!avail ? 'owned' : ''}" ${!avail || !canAfford ? 'disabled' : ''}>${!avail ? 'Owned' : 'Buy'}</button></div>`;
                if (avail && canAfford) div.querySelector('button').addEventListener('click', () => { state.money -= item.price; item.apply(); renderShop(); updateHUD(); });
                cont.appendChild(div);
            }
        }
        window.closeShop = closeShop;

        // ============================================================
        // DAY SUMMARY (unchanged)
        // ============================================================
        function endDay() {
            state.dayOver = true; state.summaryOpen = true;
            const extraLogs = Math.max(0, state.logsAtFirepit - state.quota);
            const earnings = extraLogs * 5; state.money += earnings;
            const metQuota = state.logsAtFirepit >= state.quota;
            const statsDiv = document.getElementById('summary-stats');
            document.getElementById('summary-title').textContent = `Day ${state.day} Complete`;
            statsDiv.innerHTML = `<div class="summary-stat"><span class="sl">Logs Split</span><span class="sv">${state.totalSplitToday}</span></div><div class="summary-stat"><span class="sl">Logs at Firepit</span><span class="sv">${state.logsAtFirepit}</span></div><div class="summary-stat"><span class="sl">Quota</span><span class="sv ${metQuota ? 'good' : 'bad'}">${state.logsAtFirepit}/${state.quota} ${metQuota ? 'MET' : 'MISSED'}</span></div><div class="summary-stat"><span class="sl">Extra Logs Sold</span><span class="sv">${extraLogs} x $5</span></div><div class="summary-stat"><span class="sl">Earnings</span><span class="sv good">+$${earnings}</span></div><div class="summary-stat"><span class="sl">Total Money</span><span class="sv good">$${state.money}</span></div>`;
            document.getElementById('summary').classList.add('open');
        }
        function nextDay() {
            document.getElementById('summary').classList.remove('open');
            state.day++; state.time = 0; state.logs = 0; state.splitLogs = 0; state.totalSplitToday = 0;
            state.logsAtFirepit = 0; state.quota = Math.min(5 + (state.day - 1) * 2, 30);
            state.quotaMet = false; state.dayOver = false; state.summaryOpen = false;
            state.chopProgress = 0; state.splitProgress = 0; state.isChopping = false; state.isSplitting = false;
            state.chopHit = false; state.splitHit = false;
            for (const t of trees) {
                t.hitTimer = 0;
                t.hitDir = 1;
                if (!t.alive && Math.random() < 0.5) { t.alive = true; t.health = 3; }
            }
            let aliveCount = trees.filter(t => t.alive).length;
            if (aliveCount < 10) for (let y = 3; y < 21; y++) for (let x = 1; x < 11; x++)
                if (Math.random() < 0.2 && map[y][x] === T.FOREST_FLOOR && !treeAt(x, y) && aliveCount < 20) {
                    trees.push({ x, y, alive: true, health: 3, type: hashInt(x, y, 42, 3), sway: 0, hitTimer: 0, hitDir: 1 }); aliveCount++;
                }
            player.x = 14 * TILE; player.y = 16 * TILE;
            initAmbient();
            updateHUD();
        }
        window.nextDay = nextDay;

        // ============================================================
        // HUD (unchanged)
        // ============================================================
        function updateHUD() {
            const hour = DAY_START_HOUR + state.time * (DAY_END_HOUR - DAY_START_HOUR);
            const h = Math.floor(hour), m = Math.floor((hour - h) * 60);
            const ampm = h >= 12 ? 'PM' : 'AM', h12 = h > 12 ? h - 12 : (h === 0 ? 12 : h);
            document.getElementById('hud-day').textContent = state.day;
            document.getElementById('hud-time').textContent = `${h12}:${m.toString().padStart(2, '0')} ${ampm}`;
            document.getElementById('hud-money').textContent = `$${state.money}`;
            document.getElementById('hud-logs').textContent = `${state.logs}/${state.maxCarry}`;
            document.getElementById('hud-split').textContent = state.splitLogs;
            document.getElementById('hud-quota').textContent = `${state.logsAtFirepit}/${state.quota}`;
            document.getElementById('hud-tool').textContent = state.tool === 'chainsaw' ? 'Chainsaw' : 'Axe';
        }

        // ============================================================
        // PARTICLES
        // ============================================================
        function spawnParticles(wx, wy, color, count) {
            for (let i = 0; i < count; i++) particles.push({
                x: wx, y: wy, vx: (Math.random() - 0.5) * 3, vy: (Math.random() - 0.5) * 3 - 1.5,
                life: 0.6 + Math.random() * 0.6, color, size: 2 + Math.random() * 3
            });
        }
        function updateParticles(dt) {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i]; p.x += p.vx; p.y += p.vy; p.vy += 4 * dt; p.life -= dt;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }
        function updateAmbient(dt) {
            for (const a of ambientParticles) {
                a.phase += dt * 1.5;
                if (a.type === 'butterfly') {
                    a.x += a.vx + Math.sin(a.phase) * 0.3;
                    a.y += a.vy + Math.cos(a.phase * 1.3) * 0.2;
                    if (a.x < 12 * TILE || a.x > 26 * TILE) a.vx *= -1;
                    if (a.y < 8 * TILE || a.y > 22 * TILE) a.vy *= -1;
                } else if (a.type === 'leaf') {
                    a.x += a.vx + Math.sin(a.phase) * 0.4;
                    a.y += a.vy;
                    if (a.y > 22 * TILE) { a.y = 2 * TILE; a.x = Math.random() * 11 * TILE; }
                }
            }
        }

        // ============================================================
        // INPUT
        // ============================================================
        window.addEventListener('keydown', e => { if (!keys[e.code]) justPressed[e.code] = true; keys[e.code] = true; });
        window.addEventListener('keyup', e => { keys[e.code] = false; });

        // ============================================================
        // RESIZE
        // ============================================================
        function resize() {
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width * dpr; canvas.height = rect.height * dpr;
            canvas.style.width = rect.width + 'px'; canvas.style.height = rect.height + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.imageSmoothingEnabled = false;
        }
        window.addEventListener('resize', resize);

        // ============================================================
        // RENDERING - THE BIG UPGRADE
        // ============================================================

        // Helper: draw rounded rect
        function roundRect(x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
        }

        // Helper: draw pixel
        function px(x, y, w, h, col) { ctx.fillStyle = col; ctx.fillRect(Math.floor(x), Math.floor(y), w, h); }

        // ============================================================
        // TILE DRAWING - Rich pixel art
        // ============================================================
        function drawTile(x, y, tile, sx, sy) {
            const s = TILE;
            const h1 = hash(x, y, 1), h2 = hash(x, y, 2), h3 = hash(x, y, 3);

            switch (tile) {
                case T.GRASS: {
                    const vi = hashInt(x, y, 777, SC.grass.length);
                    ctx.drawImage(SC.grass[vi], sx, sy);
                    // Overlay: flowers (unique per tile, drawn on top)
                    if (h1 > 0.82) {
                        const flowerType = hashInt(x, y, 30, 5);
                        const fx = sx + hashInt(x, y, 31, 22) + 4;
                        const fy = sy + hashInt(x, y, 32, 22) + 4;
                        drawFlower(fx, fy, flowerType);
                    }
                    // Tall grass tufts (animated, must be per-frame)
                    if (h2 > 0.55) {
                        const sway = Math.floor(Math.sin(globalTime * 2 + x * 1.5 + y) + 0.5);
                        const tx = sx + hashInt(x, y, 40, 22) + 4;
                        const ty = sy + hashInt(x, y, 41, 18) + 10;
                        ctx.fillStyle = PAL.grassShadow;
                        ctx.fillRect(tx - 1 + sway, ty, 1, -5);
                        ctx.fillRect(tx + 3 + sway, ty, 1, -4);
                        ctx.fillStyle = PAL.grassHighlight;
                        ctx.fillRect(tx + sway, ty, 1, -6);
                        ctx.fillRect(tx + 2 + sway, ty, 1, -7);
                        ctx.fillRect(tx + 4 + sway, ty, 1, -4);
                    }
                    // Small stones
                    if (h3 > 0.88) {
                        ctx.fillStyle = PAL.rock1;
                        const rx = sx + hashInt(x, y, 50, 24) + 4;
                        const ry = sy + hashInt(x, y, 51, 24) + 4;
                        ctx.fillRect(rx, ry, 4, 3);
                        ctx.fillStyle = PAL.rock2;
                        ctx.fillRect(rx, ry, 3, 2);
                    }
                    break;
                }
                case T.FOREST_FLOOR: {
                    const vi = hashInt(x, y, 778, SC.forest.length);
                    ctx.drawImage(SC.forest[vi], sx, sy);
                    // Overlay: mushrooms
                    if (h1 > 0.88) {
                        const mx = sx + hashInt(x, y, 40, 22) + 4;
                        const my = sy + hashInt(x, y, 41, 18) + 8;
                        ctx.fillStyle = PAL.mushroom1;
                        ctx.fillRect(mx + 1, my + 2, 2, 3);
                        ctx.fillStyle = PAL.mushroomCap;
                        ctx.fillRect(mx, my, 4, 3);
                        ctx.fillStyle = PAL.flowerWhite;
                        ctx.fillRect(mx + 1, my + 1, 1, 1);
                    }
                    // Small rocks
                    if (h2 > 0.82) {
                        ctx.fillStyle = PAL.rock3;
                        ctx.fillRect(sx + hashInt(x, y, 50, 24) + 4, sy + hashInt(x, y, 51, 24) + 4, 3, 2);
                        ctx.fillStyle = PAL.rock1;
                        ctx.fillRect(sx + hashInt(x, y, 50, 24) + 4, sy + hashInt(x, y, 51, 24) + 4, 2, 1);
                    }
                    break;
                }
                case T.WATER: {
                    const frame = Math.floor(globalTime * 2) % SC.water.length;
                    ctx.drawImage(SC.water[frame], sx, sy);
                    // Shore foam overlay (needs neighbor info, done per-frame)
                    drawWaterShore(x, y, sx, sy, s);
                    break;
                }
                case T.PATH: {
                    const vi = hashInt(x, y, 779, SC.path.length);
                    ctx.drawImage(SC.path[vi], sx, sy);
                    // Edge darkening where bordering non-path
                    drawPathEdges(x, y, sx, sy, s);
                    break;
                }
                case T.FIELD: {
                    const vi = hashInt(x, y, 780, SC.field.length);
                    ctx.drawImage(SC.field[vi], sx, sy);
                    // Crop overlay
                    drawFieldCrops(x, y, sx, sy, s, h1, h2);
                    break;
                }
                case T.FENCE: drawFence(x, y, sx, sy, s); break;
                case T.ROOF_HOUSE: drawHouseRoof(x, y, sx, sy, s); break;
                case T.WALL: drawHouseWall(x, y, sx, sy, s); break;
                case T.DOOR_HOUSE: drawHouseDoor(x, y, sx, sy, s); break;
                case T.WALL_SHED: drawShedWall(x, y, sx, sy, s); break;
                case T.DOOR_SHED: drawShedDoor(x, y, sx, sy, s); break;
                case T.WALL_BARN: drawBarnWall(x, y, sx, sy, s); break;
                case T.DOOR_BARN: drawBarnDoor(x, y, sx, sy, s); break;
                case T.WALL_GARAGE: drawGarageWall(x, y, sx, sy, s); break;
                case T.DOOR_GARAGE: drawGarageDoor(x, y, sx, sy, s); break;
                case T.KUBOTA: drawKubota(x, y, sx, sy, s); break;
                case T.FIREPIT: drawFirepit(x, y, sx, sy, s); break;
                case T.STORE: drawStoreWall(x, y, sx, sy, s); break;
                case T.DOOR_STORE: drawStoreDoor(x, y, sx, sy, s); break;
                default: ctx.fillStyle = '#ff00ff'; ctx.fillRect(sx, sy, s, s);
            }
        }

        // Thin overlay functions for tiles that need per-frame or neighbor-aware rendering

        function drawWaterShore(x, y, sx, sy, s) {
            const isShoreN = y > 0 && map[y - 1][x] !== T.WATER;
            const isShoreS = y < MAP_H - 1 && map[y + 1][x] !== T.WATER;
            const isShoreW = x > 0 && map[y][x - 1] !== T.WATER;
            const isShoreE = x < MAP_W - 1 && map[y][x + 1] !== T.WATER;
            if (!isShoreN && !isShoreS && !isShoreW && !isShoreE) return;
            ctx.fillStyle = PAL.waterFoam;
            ctx.globalAlpha = 0.5;
            if (isShoreN) { ctx.fillRect(sx, sy, s, 2); for (let i = 0; i < 4; i++) ctx.fillRect(sx + hashInt(x, y, 320 + i, s - 2) + 1, sy + 2 + hashInt(x, y, 330 + i, 2), 1, 1); }
            if (isShoreS) { ctx.fillRect(sx, sy + s - 2, s, 2); for (let i = 0; i < 4; i++) ctx.fillRect(sx + hashInt(x, y, 340 + i, s - 2) + 1, sy + s - 4 + hashInt(x, y, 350 + i, 2), 1, 1); }
            if (isShoreW) { ctx.fillRect(sx, sy, 2, s); for (let i = 0; i < 4; i++) ctx.fillRect(sx + 2 + hashInt(x, y, 360 + i, 2), sy + hashInt(x, y, 370 + i, s - 2) + 1, 1, 1); }
            if (isShoreE) { ctx.fillRect(sx + s - 2, sy, 2, s); for (let i = 0; i < 4; i++) ctx.fillRect(sx + s - 4 + hashInt(x, y, 380 + i, 2), sy + hashInt(x, y, 390 + i, s - 2) + 1, 1, 1); }
            ctx.globalAlpha = 1;
        }

        function drawPathEdges(x, y, sx, sy, s) {
            ctx.fillStyle = PAL.pathDark;
            ctx.globalAlpha = 0.2;
            if (y > 0 && map[y - 1][x] !== T.PATH) ctx.fillRect(sx, sy, s, 2);
            if (y < MAP_H - 1 && map[y + 1][x] !== T.PATH) ctx.fillRect(sx, sy + s - 2, s, 2);
            if (x > 0 && map[y][x - 1] !== T.PATH) ctx.fillRect(sx, sy, 2, s);
            if (x < MAP_W - 1 && map[y][x + 1] !== T.PATH) ctx.fillRect(sx + s - 2, sy, 2, s);
            ctx.globalAlpha = 1;
        }

        function drawFieldCrops(x, y, sx, sy, s, h1, h2) {
            if (h1 <= 0.2) return;
            const cropCount = hashInt(x, y, 60, 3) + 2;
            for (let i = 0; i < cropCount; i++) {
                const cx = sx + 4 + hashInt(x, y, 61 + i, 22);
                const row = hashInt(x, y, 70 + i, 3);
                const cy = sy + 2 + row * 10;
                ctx.fillStyle = PAL.flowerStem;
                ctx.fillRect(cx, cy - 2, 1, 3);
                ctx.fillStyle = PAL.fieldGreen;
                ctx.fillRect(cx - 1, cy - 3, 3, 2);
                if (h2 > 0.6) {
                    ctx.fillRect(cx - 2, cy - 1, 1, 2);
                    ctx.fillRect(cx + 2, cy - 1, 1, 2);
                }
            }
        }

        function drawFlower(fx, fy, type) {
            // Stem
            ctx.fillStyle = PAL.flowerStem;
            ctx.fillRect(fx + 1, fy + 2, 1, 4);
            // Petals
            const colors = [PAL.flowerRed, PAL.flowerYellow, PAL.flowerPink, PAL.flowerPurple, PAL.flowerWhite];
            ctx.fillStyle = colors[type];
            ctx.fillRect(fx, fy, 3, 3);
            // Center
            ctx.fillStyle = type === 1 ? PAL.flowerRed : PAL.flowerYellow;
            ctx.fillRect(fx + 1, fy + 1, 1, 1);
        }

        // --- FENCE - proper wooden posts and rails ---
        function drawFence(x, y, sx, sy, s) {
            // Grass underneath (from sprite cache)
            ctx.drawImage(SC.grass[hashInt(x, y, 777, 8)], sx, sy);

            // Check neighbors for connectivity
            const hasN = y > 0 && map[y - 1][x] === T.FENCE;
            const hasS = y < MAP_H - 1 && map[y + 1][x] === T.FENCE;
            const hasW = x > 0 && map[y][x - 1] === T.FENCE;
            const hasE = x < MAP_W - 1 && map[y][x + 1] === T.FENCE;

            // Center post (always drawn)
            ctx.fillStyle = PAL.fenceDark;
            ctx.fillRect(sx + 13, sy + 4, 6, 24);
            ctx.fillStyle = PAL.fenceWood;
            ctx.fillRect(sx + 14, sy + 5, 4, 22);
            // Post cap
            ctx.fillStyle = PAL.fenceLight;
            ctx.fillRect(sx + 13, sy + 3, 6, 2);

            // Horizontal rails going east
            if (hasE) {
                ctx.fillStyle = PAL.fenceDark;
                ctx.fillRect(sx + 18, sy + 10, s - 18, 4);
                ctx.fillRect(sx + 18, sy + 20, s - 18, 4);
                ctx.fillStyle = PAL.fenceWood;
                ctx.fillRect(sx + 18, sy + 10, s - 18, 3);
                ctx.fillRect(sx + 18, sy + 20, s - 18, 3);
                ctx.fillStyle = PAL.fenceLight;
                ctx.fillRect(sx + 18, sy + 10, s - 18, 1);
                ctx.fillRect(sx + 18, sy + 20, s - 18, 1);
            }
            // Horizontal rails going west
            if (hasW) {
                ctx.fillStyle = PAL.fenceDark;
                ctx.fillRect(sx, sy + 10, 14, 4);
                ctx.fillRect(sx, sy + 20, 14, 4);
                ctx.fillStyle = PAL.fenceWood;
                ctx.fillRect(sx, sy + 10, 14, 3);
                ctx.fillRect(sx, sy + 20, 14, 3);
                ctx.fillStyle = PAL.fenceLight;
                ctx.fillRect(sx, sy + 10, 14, 1);
                ctx.fillRect(sx, sy + 20, 14, 1);
            }
            // Vertical rails going south
            if (hasS) {
                ctx.fillStyle = PAL.fenceDark;
                ctx.fillRect(sx + 9, sy + 18, 4, s - 18);
                ctx.fillRect(sx + 19, sy + 18, 4, s - 18);
                ctx.fillStyle = PAL.fenceWood;
                ctx.fillRect(sx + 9, sy + 18, 3, s - 18);
                ctx.fillRect(sx + 19, sy + 18, 3, s - 18);
                ctx.fillStyle = PAL.fenceLight;
                ctx.fillRect(sx + 9, sy + 18, 1, s - 18);
                ctx.fillRect(sx + 19, sy + 18, 1, s - 18);
            }
            // Vertical rails going north
            if (hasN) {
                ctx.fillStyle = PAL.fenceDark;
                ctx.fillRect(sx + 9, sy, 4, 10);
                ctx.fillRect(sx + 19, sy, 4, 10);
                ctx.fillStyle = PAL.fenceWood;
                ctx.fillRect(sx + 9, sy, 3, 10);
                ctx.fillRect(sx + 19, sy, 3, 10);
                ctx.fillStyle = PAL.fenceLight;
                ctx.fillRect(sx + 9, sy, 1, 10);
                ctx.fillRect(sx + 19, sy, 1, 10);
            }

            // Isolated post: add short decorative cross-rails
            if (!hasN && !hasS && !hasW && !hasE) {
                ctx.fillStyle = PAL.fenceDark;
                ctx.fillRect(sx + 6, sy + 10, 20, 4);
                ctx.fillRect(sx + 6, sy + 20, 20, 4);
                ctx.fillStyle = PAL.fenceWood;
                ctx.fillRect(sx + 6, sy + 10, 20, 3);
                ctx.fillRect(sx + 6, sy + 20, 20, 3);
                ctx.fillStyle = PAL.fenceLight;
                ctx.fillRect(sx + 6, sy + 10, 20, 1);
                ctx.fillRect(sx + 6, sy + 20, 20, 1);
            }
        }

        // --- FARMHOUSE ---
        function drawHouseRoof(x, y, sx, sy, s) {
            // Roof shingles
            ctx.fillStyle = PAL.roofRed;
            ctx.fillRect(sx, sy, s, s);
            // Shingle pattern
            for (let row = 0; row < 4; row++) {
                const ry = sy + row * 8;
                ctx.fillStyle = PAL.roofRedDark;
                ctx.fillRect(sx, ry + 7, s, 1);
                // Offset shingles
                for (let col = 0; col < 4; col++) {
                    const cx = sx + col * 8 + (row % 2) * 4;
                    ctx.fillStyle = PAL.roofRedLight;
                    ctx.fillRect(cx + 1, ry + 1, 6, 2);
                }
            }
            // Eave
            ctx.fillStyle = PAL.roofRedDark;
            ctx.fillRect(sx, sy + s - 2, s, 2);

            // Chimney on rightmost roof tile
            const bx = 15; // building start x
            if (x === bx + 4 && y === 10) {
                ctx.fillStyle = PAL.stoneDark;
                ctx.fillRect(sx + 18, sy - 10, 8, 14);
                ctx.fillStyle = PAL.stoneBase;
                ctx.fillRect(sx + 19, sy - 9, 6, 12);
                ctx.fillStyle = PAL.stoneLight;
                ctx.fillRect(sx + 20, sy - 8, 4, 2);
                ctx.fillRect(sx + 20, sy - 4, 4, 2);
                // Smoke
                const smoke = Math.round(Math.sin(globalTime * 2) * 2);
                ctx.fillStyle = 'rgba(180,180,180,0.25)';
                fillCircle(sx + 22 + smoke, sy - 14, 3);
                ctx.fillStyle = 'rgba(180,180,180,0.15)';
                fillCircle(sx + 24 + Math.round(smoke * 1.5), sy - 20, 4);
            }
        }

        function drawHouseWall(x, y, sx, sy, s) {
            // Stone foundation bottom 6px
            ctx.fillStyle = PAL.stoneBase;
            ctx.fillRect(sx, sy + s - 6, s, 6);
            ctx.fillStyle = PAL.stoneDark;
            ctx.fillRect(sx, sy + s - 6, s, 1);
            // Wooden wall
            ctx.fillStyle = PAL.wallWood;
            ctx.fillRect(sx, sy, s, s - 6);
            // Wood plank lines
            ctx.fillStyle = PAL.wallWoodDark;
            for (let i = 0; i < 4; i++) ctx.fillRect(sx, sy + i * 7, s, 1);
            // Highlight
            ctx.fillStyle = PAL.wallWoodLight;
            ctx.globalAlpha = 0.2;
            ctx.fillRect(sx, sy + 1, s, 2);
            ctx.globalAlpha = 1;

            // Windows on middle wall tiles
            const bx = 15;
            if ((x === bx || x === bx + 3 || x === bx + 4) && y >= 11) {
                drawWindow(sx + 8, sy + 4, 16, 14);
            }
        }

        function drawWindow(wx, wy, ww, wh) {
            // Frame
            ctx.fillStyle = PAL.windowFrame;
            ctx.fillRect(wx - 1, wy - 1, ww + 2, wh + 2);
            // Glass
            ctx.fillStyle = PAL.windowGlass;
            ctx.fillRect(wx, wy, ww, wh);
            // Warm interior glow
            ctx.fillStyle = PAL.windowGlow;
            ctx.globalAlpha = 0.35 + Math.sin(globalTime) * 0.05;
            ctx.fillRect(wx + 2, wy + 2, ww - 4, wh - 4);
            ctx.globalAlpha = 1;
            // Cross bars
            ctx.fillStyle = PAL.windowFrame;
            ctx.fillRect(wx + ww / 2 - 1, wy, 2, wh);
            ctx.fillRect(wx, wy + wh / 2 - 1, ww, 2);
            // Highlight
            ctx.fillStyle = '#fff';
            ctx.globalAlpha = 0.15;
            ctx.fillRect(wx + 1, wy + 1, ww / 2 - 2, wh / 2 - 2);
            ctx.globalAlpha = 1;
        }

        function drawHouseDoor(x, y, sx, sy, s) {
            // Wall base
            ctx.fillStyle = PAL.wallWood;
            ctx.fillRect(sx, sy, s, s);
            ctx.fillStyle = PAL.wallWoodDark;
            for (let i = 0; i < 4; i++) ctx.fillRect(sx, sy + i * 7, s, 1);
            // Stone foundation
            ctx.fillStyle = PAL.stoneBase;
            ctx.fillRect(sx, sy + s - 4, s, 4);
            // Door
            ctx.fillStyle = PAL.doorDark;
            ctx.fillRect(sx + 7, sy + 2, 18, s - 2);
            ctx.fillStyle = PAL.door;
            ctx.fillRect(sx + 8, sy + 3, 16, s - 4);
            // Door panels
            ctx.fillStyle = PAL.doorDark;
            ctx.fillRect(sx + 10, sy + 5, 12, 1);
            ctx.fillRect(sx + 10, sy + 14, 12, 1);
            ctx.fillRect(sx + 15, sy + 4, 1, 24);
            // Handle
            ctx.fillStyle = PAL.doorHandle;
            ctx.fillRect(sx + 20, sy + 16, 2, 3);
            // Step
            ctx.fillStyle = PAL.stoneLight;
            ctx.fillRect(sx + 4, sy + s - 2, 24, 4);
            ctx.fillStyle = PAL.stoneBase;
            ctx.fillRect(sx + 4, sy + s - 2, 24, 1);
        }

        // --- WOOD SHED ---
        function drawShedWall(x, y, sx, sy, s) {
            ctx.fillStyle = PAL.shedWood;
            ctx.fillRect(sx, sy, s, s);
            // Horizontal planks
            ctx.fillStyle = PAL.shedWoodDark;
            for (let i = 0; i < 5; i++) ctx.fillRect(sx, sy + i * 6 + 5, s, 1);
            // Roof on top row
            if (y === 10) {
                ctx.fillStyle = PAL.shedRoof;
                ctx.fillRect(sx - 2, sy, s + 4, s);
                ctx.fillStyle = '#5a5a58';
                for (let i = 0; i < 4; i++) ctx.fillRect(sx - 2, sy + 1 + i * 8, s + 4, 2);
            }
            // Sawhorse detail on middle
            if (y === 11 && x === 23) {
                ctx.fillStyle = PAL.woodMid;
                ctx.fillRect(sx + 4, sy + 14, 20, 3);
                ctx.fillRect(sx + 8, sy + 17, 3, 10);
                ctx.fillRect(sx + 18, sy + 17, 3, 10);
                // Log on sawhorse

                ctx.fillRect(sx + 2, sy + 10, 24, 4);
                ctx.fillStyle = PAL.bark;

        function drawShedDoor(x, y, sx, sy, s) {
            ctx.fillStyle = PAL.shedWood;

        // --- BARN ---
        function drawBarnWall(x, y, sx, sy, s) {

        function drawBarnDoor(x, y, sx, sy, s) {

        // --- GARAGE ---
        function drawGarageWall(x, y, sx, sy, s) {
